<!DOCTYPE html>
<!--
  ============================================================================
  MultiAgent Cowork · SOC AI Platform —— 产品 UI 可交互演示
  ----------------------------------------------------------------------------
  设计令牌（颜色/圆角/字号）对齐当前前端 index.css 的 :root 与
  html[data-theme="light"]，支持深色 / 浅色主题切换。
  页面结构对齐真实产品：SOC Hub 列表（7 张统计卡 + 分歧趋势图 + 多维筛选）、
  事件详情（资产情报 / AI 流水线 / 处置决策 三栏）、Agent 配置中心。

  演示数据取自 10 个真实历史工单，其中单号、主机名、IP、域名、账号、人名、
  文件哈希等敏感信息均已替换为示例值（example.com / RFC5737 文档地址段等）。

  自包含单文件，不联网、不依赖后端，双击即可打开。
  ============================================================================
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOC Hub · MultiAgent Cowork · 产品演示</title>
<style>
  /* ===== 设计令牌：逐字对齐 frontend/src/index.css ===== */
  :root{
    --bg:#0A0E14; --surface:#0B1018; --surface-2:#0F141B; --surface-3:#293548; --surface-hover:#16202E;
    --border:#1F2937; --border-strong:#334155; --border-mid:#4B5563;
    --text-bright:#E5E7EB; --text:#CBD5E1; --text-2:#94A3B8; --text-muted:#64748B; --text-faint:#475569;
    --accent:#60A5FA; --accent-soft:#93C5FD; --accent-strong:#3B82F6; --accent-deep:#1D4ED8; --accent-on-tint:#DBEAFE;
    --warn:#F59E0B; --warn-soft:#FBBF24; --warn-softer:#FCD34D; --warn-alt:#FACC15; --warn-orange:#FB923C;
    --danger:#F87171; --danger-soft:#FCA5A5; --danger-strong:#EF4444; --danger-deep:#B91C1C;
    --success:#34D399; --success-strong:#10B981; --teal:#5EEAD4; --purple:#8B5CF6;
    /* 演示页自有令牌（真实前端由 Tailwind 提供等价值） */
    --sidebar:#080B11; --code-bg:#070A0F; --code-fg:#A9C2DD;
    --shadow:0 8px 30px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E2E6EC; --surface-hover:#E6EAF0;
    --border:#E2E8F0; --border-strong:#CBD5E1; --border-mid:#94A3B8;
    --text-bright:#0F172A; --text:#1E293B; --text-2:#475569; --text-muted:#64748B; --text-faint:#94A3B8;
    --accent:#2563EB; --accent-soft:#3B82F6; --accent-strong:#1D4ED8; --accent-deep:#1E40AF; --accent-on-tint:#1E40AF;
    --warn:#B45309; --warn-soft:#D97706; --warn-softer:#B45309; --warn-alt:#A16207; --warn-orange:#C2410C;
    --danger:#DC2626; --danger-soft:#EF4444; --danger-strong:#DC2626; --danger-deep:#B91C1C;
    --success:#059669; --success-strong:#047857; --teal:#0D9488; --purple:#7C3AED;
    --sidebar:#FFFFFF; --code-bg:#F8FAFC; --code-fg:#334155;
    --shadow:0 8px 30px rgba(15,23,42,.12);
    color-scheme:light;
  }
  :root{
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text-bright);font-family:var(--sans);font-size:13.5px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s,color .2s;
  }
  .mono{font-family:var(--mono)}
  .muted{color:var(--text-muted)} .dim{color:var(--text)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ================= 应用骨架（对齐 Primitives.jsx 的 Sidebar / TopBar / Panel） ================= */
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:220px;flex:0 0 220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s ease-out}
  body.side-collapsed .sidebar{width:64px;flex-basis:64px}
  .sideHead{padding:18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  body.side-collapsed .sideHead{padding:16px 12px;flex-direction:column;gap:8px}
  .logo{width:32px;height:32px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
        background:linear-gradient(135deg,var(--accent-strong),var(--accent-deep));box-shadow:0 0 12px rgba(59,130,246,.35)}
  .sideHead .nm{font-size:12px;font-weight:600;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sideHead .sb{font-size:10px;font-family:var(--mono);letter-spacing:.08em;color:var(--text-muted)}
  .sideHead .txt{min-width:0;flex:1}
  body.side-collapsed .sideHead .txt{display:none}
  .collapseBtn{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--border);
               background:transparent;color:var(--text-muted);cursor:pointer}
  .collapseBtn:hover{background:var(--surface-hover)}
  body.side-collapsed .collapseBtn svg{transform:rotate(180deg)}
  .sideNav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
  body.side-collapsed .sideNav{padding:16px 8px}
  .navlabel{font-size:10px;letter-spacing:.18em;font-weight:500;color:var(--text-faint);padding:0 12px;margin-bottom:8px}
  .navlabel.mt{margin-top:24px}
  body.side-collapsed .navlabel{display:none}
  .nav{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;font-size:13px;text-align:left;
       color:var(--text-2);background:transparent;border:1px solid transparent;cursor:pointer;font-family:var(--sans);transition:.14s}
  .nav:hover{background:var(--surface-2)}
  .nav .ic{flex:0 0 auto;color:var(--text-muted);display:grid;place-items:center}
  .nav .lb{flex:1;white-space:nowrap;overflow:hidden}
  .nav.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.25);color:var(--accent-soft);font-weight:500}
  html[data-theme="light"] .nav.active{color:var(--accent-strong)}
  .nav.active .ic{color:var(--accent)}
  .nav.disabled{color:var(--text-faint);opacity:.55;cursor:not-allowed}
  .nav .ct{font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;background:rgba(148,163,184,.1);color:var(--text-2)}
  .nav.active .ct{background:rgba(59,130,246,.18);color:var(--accent-strong)}
  .nav .cm{font-size:10px;font-family:var(--mono);color:var(--text-faint)}
  body.side-collapsed .nav{justify-content:center;padding:8px 0}
  body.side-collapsed .nav .lb,body.side-collapsed .nav .ct,body.side-collapsed .nav .cm{display:none}
  .sideFoot{padding:12px;border-top:1px solid var(--border);display:flex;justify-content:center}
  .themeSeg{display:flex;align-items:center;gap:2px;padding:2px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2)}
  body.side-collapsed .themeSeg{flex-direction:column}
  .themeSeg button{padding:6px;border-radius:999px;border:0;background:transparent;color:var(--text-muted);cursor:pointer;display:grid;place-items:center}
  .themeSeg button.on{background:var(--surface);color:var(--text-bright);box-shadow:0 1px 2px rgba(0,0,0,.18)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:24px;padding:0 24px;background:var(--surface)}
  .tbleft{min-width:0}
  .crumb{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--text-muted)}
  .crumb .sep{color:var(--border-strong)}
  .crumb .cur{color:var(--accent)}
  .topbar h1{font-size:15px;font-weight:600;margin:2px 0 0;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
  .topbar .spacer{flex:1}
  .syncPill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;font-size:11px;font-family:var(--mono);
            border:1px solid var(--border);background:var(--surface-2)}
  .syncPill .lb{color:var(--text-2)} .syncPill .sep{color:var(--border-strong)} .syncPill .vl{color:var(--text-bright)}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--success-strong);box-shadow:0 0 6px var(--success-strong);animation:bp 1.8s infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
  .demoPill{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--teal);border:1px solid var(--border-strong);background:var(--surface-2);border-radius:999px;padding:3px 9px}
  .btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-bright);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:.14s}
  .btn:hover{border-color:var(--border-strong)}
  .btn.primary{background:var(--accent-strong);border-color:transparent;color:#fff;font-weight:500;box-shadow:0 0 10px rgba(59,130,246,.3)}
  .btn.sm{padding:5px 10px;font-size:11.5px}
  .toggle{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);cursor:pointer;user-select:none}
  .switch{width:32px;height:18px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:.2s}
  .switch::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--text-muted);top:2px;left:2px;transition:.2s}
  .toggle.on .switch{background:rgba(59,130,246,.35);border-color:var(--accent)}
  .toggle.on .switch::after{left:16px;background:var(--accent)}

  .screen{flex:1;overflow:auto;background:var(--bg)}
  .page{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
  /* Panel 对齐 Primitives.jsx：surface-2 底、圆角 8px、1px 边 */
  .panel{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .panel > .ph{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border)}
  .panel > .pb{padding:20px}
  .panel > .pb.p0{padding:0}
  .panel > .pb.p4{padding:16px}
  .eyebrow{font-size:10px;letter-spacing:.18em;font-family:var(--mono);font-weight:500;color:var(--accent);margin-bottom:4px}
  .ptitle{font-size:13px;font-weight:600;color:var(--text-bright)}

  /* ================= 徽章 / 判定 chip（主题自适应：半透明底 + 令牌文字色） ================= */
  .pbadge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;font-weight:800;font-size:12.5px;font-family:var(--mono);border:1px solid transparent}
  .dot{width:8px;height:8px;border-radius:50%}
  .p1{background:rgba(239,68,68,.15);color:var(--danger);border-color:rgba(239,68,68,.35)}
  .p1 .dot{background:var(--danger-strong)}
  .p2{background:rgba(245,158,11,.15);color:var(--warn-softer);border-color:rgba(245,158,11,.35)}
  .p2 .dot{background:var(--warn)}
  .p3{background:rgba(234,179,8,.15);color:var(--warn-alt);border-color:rgba(234,179,8,.35)}
  .p3 .dot{background:var(--warn-alt)}
  .p4{background:rgba(16,185,129,.15);color:var(--success);border-color:rgba(16,185,129,.35)}
  .p4 .dot{background:var(--success-strong)}

  .chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;padding:1.5px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
  .chip.tp{background:rgba(239,68,68,.12);color:var(--danger);border-color:rgba(239,68,68,.30)}
  .chip.fp{background:rgba(148,163,184,.14);color:var(--text-2);border-color:rgba(148,163,184,.30)}
  .chip.benign{background:rgba(16,185,129,.12);color:var(--success);border-color:rgba(16,185,129,.30)}
  .chip.indeterminate{background:rgba(245,158,11,.12);color:var(--warn-softer);border-color:rgba(245,158,11,.30)}
  .chip.human{background:rgba(139,92,246,.14);color:var(--purple);border-color:rgba(139,92,246,.32)}
  .chip.none{background:transparent;color:var(--text-faint);border-color:var(--border)}
  .chip.ok{background:rgba(16,185,129,.10);color:var(--success);border-color:rgba(16,185,129,.30)}
  .chip.run{background:rgba(59,130,246,.12);color:var(--accent);border-color:rgba(59,130,246,.35)}
  .chip.warn{background:rgba(245,158,11,.10);color:var(--warn-softer);border-color:rgba(245,158,11,.32)}
  .chip.skip{background:transparent;color:var(--text-2);border-color:var(--border)}
  .divmark{color:var(--warn-soft);font-weight:700;margin-left:4px;cursor:help}

  .critbadge{font-size:11px;padding:2px 9px;border-radius:6px;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .crit-critical{background:rgba(239,68,68,.14);color:var(--danger);border-color:rgba(239,68,68,.3)}
  .crit-high{background:rgba(245,158,11,.14);color:var(--warn-softer);border-color:rgba(245,158,11,.3)}
  .crit-medium{background:rgba(96,165,250,.14);color:var(--accent);border-color:rgba(96,165,250,.3)}
  .crit-low{background:rgba(148,163,184,.12);color:var(--text-2);border-color:rgba(148,163,184,.25)}
  .crit-unknown{background:transparent;color:var(--text-faint);border-color:var(--border)}

  /* ================= SOC Hub 列表（对齐 AlertList.jsx） ================= */
  .filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .searchbox{flex:1;min-width:280px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 12px}
  .searchbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text-bright);font-family:var(--mono);font-size:12px}
  .searchbox input::placeholder{color:var(--text-faint)}
  .kbd{font-size:10px;color:var(--text-faint);font-family:var(--mono)}
  .seg{display:flex;align-items:center;gap:4px;padding:4px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2)}
  .seg .lb{padding:0 6px;font-size:10px;color:var(--text-muted)}
  .seg button{background:transparent;border:0;border-radius:4px;color:var(--text-2);padding:4px 10px;font-size:11px;font-weight:500;
              cursor:pointer;font-family:var(--mono);transition:.12s}
  .seg button:hover{color:var(--text-bright)}
  .seg button.on{background:rgba(59,130,246,.18);color:var(--accent-strong)}
  .dd{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);
      font-size:11px;color:var(--text);cursor:pointer;white-space:nowrap;transition:.12s}
  .dd:hover{border-color:var(--border-strong)}
  .dd .k{color:var(--text-muted)}
  .dd b{color:var(--text-bright);font-weight:500}
  .dd .ar{font-size:7px;color:var(--text-muted)}
  .listcnt{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--text-muted)}
  .listcnt b{color:var(--accent);font-weight:500}
  /* 口径不写出来就会被当成累计值读（291/全量 vs 76/7天 差了三倍） */
  .scopecap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--text-muted);margin-bottom:-8px}
  .scopecap .w{color:var(--text-2);font-weight:500}
  .scopecap .m{font-family:var(--mono)}

  .stats{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
  @media(max-width:1500px){.stats{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat-card{border-radius:8px;overflow:hidden;cursor:pointer;transition:.14s;text-align:left;background:var(--surface);
             border:1px solid var(--border);border-top:2px solid var(--cat);box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .stat-card:hover{background:var(--surface-2)}
  .stat-card.active{background:var(--surface-2);border-color:var(--cat);transform:translateY(-1px);box-shadow:0 0 0 2px var(--catRing)}
  .sc-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 16px;background:var(--catTint)}
  .sc-en{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.15em;font-weight:600;color:var(--catFg)}
  .sc-on{font-size:9px;font-family:var(--mono);padding:1px 4px;border-radius:3px;background:var(--cat);color:var(--surface)}
  .sc-num{font-size:20px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--catNum);line-height:1}
  .sc-body{padding:12px 16px}
  .sc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .sc-cn{font-size:12px;color:var(--text)}
  .sc-sub{font-size:10px;font-family:var(--mono);color:var(--text-muted)}
  .spark{display:flex;align-items:flex-end;gap:4px;height:24px}
  .spark i{flex:1;border-radius:2px;background:var(--cat)}

  /* ---- DIVERGENT 趋势 ---- */
  .trendhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px 4px}
  .trendhead .ti{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .trendhead .tt{font-size:11px;letter-spacing:.15em;font-weight:600;color:var(--purple)}
  .trendhead .ts{font-size:10.5px;color:var(--text-2)}
  .trendhead .tm{font-size:10.5px;color:var(--text-muted)}
  /* 颜色是唯一区分手段时色觉障碍用户就读不出来了：图例 + 末端直标两重冗余 */
  .legend{display:flex;align-items:center;gap:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--text-2)}
  .legend i{width:10px;height:2px;border-radius:1px}
  .trendbody{padding:0 16px 8px}
  .trendbody text{font-variant-numeric:tabular-nums}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface-2);border:1px solid var(--border-strong);
       border-radius:4px;padding:6px 9px;font-size:10.5px;font-family:var(--mono);line-height:1.6;white-space:nowrap;
       box-shadow:0 4px 16px rgba(15,23,42,.18);z-index:30}

  /* ---- 工单表：12 列在窄屏挤成竖排会完全不可读，宁可横向滚动也不压缩列宽 ---- */
  .tablewrap{overflow-x:auto}
  table.tickets{width:100%;border-collapse:collapse;font-size:12px;min-width:1340px}
  table.tickets th{text-align:left;font-size:10.5px;letter-spacing:.12em;font-weight:500;color:var(--text-muted);
                   padding:12px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.tickets td{padding:12px 8px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
  table.tickets th:first-child,table.tickets td:first-child{padding-left:16px}
  table.tickets th:last-child,table.tickets td:last-child{padding-right:16px}
  table.tickets tr.trow{cursor:pointer;transition:background .12s}
  table.tickets tr.trow:hover{background:rgba(59,130,246,.05)}
  table.tickets.sop{min-width:0}
  table.tickets input[type=checkbox]{accent-color:var(--accent-strong);cursor:pointer}
  .selcol{width:32px}
  .mssrow{display:flex;align-items:center;gap:8px}
  .sdot{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .mss{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text);white-space:nowrap}
  table.tickets tr.trow:hover .mss{color:var(--accent-strong)}
  .tstamp{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-top:2px;padding-left:13px;white-space:nowrap}
  .alertcell{min-width:240px}
  .alertcell .nmrow{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-bright);line-height:1.3}
  .alertcell .rl{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-top:3px;overflow-wrap:anywhere}
  .divtag{flex:0 0 auto;font-size:9.5px;font-family:var(--mono);padding:1px 6px;border-radius:4px;
          background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35);color:var(--warn-soft)}
  .inteltag{flex:0 0 auto;font-size:9.5px;font-family:var(--mono);padding:1px 5px;border-radius:4px;
            background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.28);color:var(--danger)}
  .divmark{color:var(--warn-soft);cursor:help}

                       color:var(--text-2);font-family:var(--mono);font-size:11px;cursor:pointer}

  /* ================= 事件详情 ================= */

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:16px}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--text-muted);flex:0 0 auto} .kv .v{color:var(--text-bright);text-align:right;font-family:var(--mono);overflow-wrap:anywhere}
  .srcrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}

  .srcrow .nm{font-size:12px} .srcrow .sc{font-family:var(--mono);font-weight:700}
  .scorebox{margin-top:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px}

  .bar > i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .note{border-radius:9px;padding:8px 11px;font-size:11.5px;line-height:1.6;margin-top:10px;overflow-wrap:anywhere}
  .note.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:var(--warn-softer)}
  .note.info{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3);color:var(--accent)}
  .note.ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);color:var(--success)}

  .tl{position:relative}
  .node{position:relative;padding:0 0 16px 50px}
  .node:not(:last-child)::before{content:"";position:absolute;left:18px;top:38px;bottom:-2px;width:2px;background:linear-gradient(180deg,rgba(96,165,250,.35),rgba(96,165,250,.05))}
  .glyph{position:absolute;left:0;top:0;width:38px;height:38px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;color:var(--text-muted)}
  .glyph::before{content:"";position:absolute;inset:0;background:var(--surface-2);transition:.25s}
  .glyph.hex::before{clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%)}
  .glyph.tri::before{clip-path:polygon(50% 8%,93% 90%,7% 90%)}
  .glyph.dia::before{clip-path:polygon(50% 4%,96% 50%,50% 96%,4% 50%)}
  .glyph.sq::before{clip-path:inset(6% round 8px)}
  .glyph span{position:relative;z-index:1}
  .node.done .glyph::before{background:rgba(96,165,250,.16)}
  .node.done .glyph{color:var(--accent)}
  .node.run .glyph::before{background:rgba(59,130,246,.2)}
  .node.run .glyph{color:var(--accent);animation:gp 1.1s infinite}
  .node.skip .glyph::before{background:var(--surface-2)}
  .node.human .glyph::before{background:rgba(139,92,246,.18)}
  .node.human .glyph{color:var(--purple)}
  @keyframes gp{0%,100%{filter:drop-shadow(0 0 0 rgba(59,130,246,.5))}50%{filter:drop-shadow(0 0 6px rgba(59,130,246,.5))}}

  .acard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:.3s}
  .node.run .acard{border-color:rgba(59,130,246,.45)}
  .node.skip .acard{opacity:.72}
  .ahead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .code{font-family:var(--mono);font-weight:700;font-size:13px}
  .aname{color:var(--text);font-size:12.5px}
  .ahead .right{margin-left:auto;display:flex;align-items:center;gap:7px}
  .model-tag{font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--teal)}
  .model-tag.esc{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.4);color:var(--purple)}
  .ameta{font-size:10.5px;color:var(--text-muted);font-family:var(--mono);margin-top:5px}
  .abody{margin-top:10px}
  .out-summary{font-size:12.5px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-top:8px;overflow-wrap:anywhere;line-height:1.65}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .field{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;min-width:0}

  .field .val{font-size:12.5px;margin-top:3px;font-weight:600;overflow-wrap:anywhere}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:6px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--warn-softer)}

  .chain .arr{color:var(--text-muted)}
  .raw{margin-top:9px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .raw > summary{list-style:none;cursor:pointer;padding:7px 11px;font-size:11px;color:var(--text-muted);font-family:var(--mono);background:var(--surface-2);display:flex;align-items:center;gap:7px}

  .raw > summary::before{content:"▸";transition:.2s}
  .raw[open] > summary::before{transform:rotate(90deg)}

  .plfoot{font-family:var(--mono);font-size:11px;color:var(--text-muted);padding-left:50px;margin-top:-8px}

  .adj-sum{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.28);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--text);overflow-wrap:anywhere}

  .evi .b{color:var(--accent);flex:0 0 auto}
  .dispbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .btn.full{width:100%;text-align:center}
  .btn.danger{border-color:rgba(239,68,68,.4);color:var(--danger)}
  .btn.ghost{background:transparent}

  /* ================= Agent 配置中心 ================= */
  .agrow{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
  @media(max-width:1200px){.agrow{grid-template-columns:repeat(2,1fr)}}
  .agc{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 15px;cursor:pointer;transition:.14s}

  .sphead{display:flex;align-items:center;gap:11px}
  .sp-desc{font-size:12.5px;color:var(--text);line-height:1.6;margin:8px 0}
  .sp-meta{font-size:11px;font-family:var(--mono);color:var(--text-muted);margin-bottom:10px}
  .promptbox{border:1px solid var(--border);border-radius:10px;background:var(--code-bg);overflow:auto;max-height:560px;font-family:var(--mono);font-size:12px;line-height:1.7}
  .prow{display:flex}
  .prow:hover{background:var(--surface-hover)}
  .pn{flex:0 0 44px;text-align:right;padding:0 12px 0 6px;color:var(--text-faint);user-select:none;border-right:1px solid var(--border)}
  .pt{padding:0 14px;color:var(--code-fg);white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
  .ph{color:var(--accent);font-weight:700}
  .pt b{color:var(--text-bright);font-weight:700}
  .pc{color:var(--teal)}
  .hnode{text-align:center;padding:16px 10px 4px}

  .hnode .t{font-size:15px;font-weight:700;margin-bottom:8px}
  .hnode .d{font-size:12.5px;color:var(--text);max-width:460px;margin:0 auto;line-height:1.65}
  .decbox{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:14px 16px;margin:16px auto 0;text-align:left;max-width:440px}
  .decbox .dt{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--warn);font-weight:700;margin-bottom:10px}
  .decitem{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
  .decitem:last-child{border-bottom:0}
  .decitem .no{font-family:var(--mono);font-size:11px;color:var(--warn);flex:0 0 auto;padding-top:1px}
  .decitem .dn{font-weight:600;font-size:12.5px}
  .decitem .dd2{font-size:11.5px;color:var(--text-muted);margin-top:1px}
  .apisrc{border-bottom:1px dashed var(--border);padding:9px 0}
  .apisrc:last-child{border-bottom:0}
  .apisrc .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .apisrc .nm{font-size:12.5px;font-weight:600}
  .apisrc .on{font-size:9.5px;color:var(--success);letter-spacing:.6px;display:flex;align-items:center;gap:5px}
  .apisrc .r2{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text-muted);font-family:var(--mono);gap:8px}

  /* ================= 讲解注释 ================= */
  .pin{display:none;width:16px;height:16px;border-radius:50%;background:var(--accent-strong);color:#fff;font-size:9.5px;font-weight:700;align-items:center;justify-content:center;cursor:help;vertical-align:super;margin-left:5px;position:relative;font-family:var(--mono)}
  body.notes-on .pin{display:inline-flex;animation:pinp 1.7s infinite}
  @keyframes pinp{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 5px rgba(59,130,246,0)}}
  .pin .tip{display:none;position:absolute;bottom:150%;left:50%;transform:translateX(-50%);width:258px;background:var(--surface-2);border:1px solid var(--accent);border-radius:9px;padding:9px 11px;font-size:11.5px;line-height:1.6;color:var(--text);font-weight:400;text-align:left;z-index:60;box-shadow:var(--shadow)}
  .pin:hover .tip{display:block}
  .notes-banner{display:none;margin-bottom:16px;padding:9px 13px;border:1px dashed var(--accent);border-radius:10px;background:rgba(59,130,246,.06);font-size:12px;color:var(--text);line-height:1.7}
  body.notes-on .notes-banner{display:block}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;padding:10px 18px;font-size:12.5px;color:var(--text-bright);opacity:0;transition:.25s;z-index:80;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

function bucketLabel(d,b){
  const dt=new Date(Date.UTC(TREND_START[0],TREND_START[1]-1,TREND_START[2]+d,b*TREND_BUCKET_H));
  const p=n=>String(n).padStart(2,'0');

function buildTrend(){

  const SHAPE=[0,0,1,2,2,2,1,0], SS=8, raw=[];
  TREND_DAILY.forEach(([cmp,div],d)=>{
    let acc=0, done=0;
    for(let b=0;b<TREND_PER_DAY;b++){
      acc+=cmp*SHAPE[b]/SS;
      const take=(b===TREND_PER_DAY-1)?cmp-done:Math.round(acc)-done;
      done+=take;
      raw.push({d,b,cmp:take,div:(b===3+d%3?div:0)});
    }
  });
  const WIN=TREND_ROLL_DAYS*TREND_PER_DAY;
  const pts=[]; let cc=TREND_BASE.cmp, cd=TREND_BASE.div;
  raw.forEach((r,i)=>{
    cc+=r.cmp; cd+=r.div;
    if(i<WIN) return;                       // 前 7 天只供第一个采样点回看
    let rc=0, rd=0;
    for(let k=i-WIN+1;k<=i;k++){ rc+=raw[k].cmp; rd+=raw[k].div; }
    pts.push({key:i,label:bucketLabel(r.d,r.b),hasData:r.cmp>0,
      comparable:r.cmp,divergent:r.div,

      rollN:rc,rollDiv:rd,rollPct: rc>=TREND_MIN_N ? +(rd/rc*100).toFixed(1) : null});

}

  pts.forEach((p,i)=>{ if(p.hasData && xAt(i)-lastX>=GAP){ vset.add(i); lastX=xAt(i); } });
  const lastI=pts.length-1;
  if(!vset.has(lastI)){ const prev=Math.max(...vset); if(xAt(lastI)-xAt(prev)<GAP) vset.delete(prev); vset.add(lastI); }
  pts.forEach((p,i)=>{ if(vset.has(i)) g+=T(xAt(i),yAt(p.cumPct)-9,p.cumPct+'%','font-size:10px;fill:var(--text-2)','middle'); });
  const lr=[...pts].reverse().find(p=>p.rollPct!=null);
  if(lr){ const i=pts.indexOf(lr);
    // 标签背离累计线放置：两线末端挨近时，固定朝下会压在累计线的数值标签上。
    g+=T(xAt(i),yAt(lr.rollPct)+(lr.rollPct>=lr.cumPct?-9:15),lr.rollPct+'%',`font-size:10px;fill:${TREND_SERIES.roll.color}`,'middle');
  }
  const half=plotW/(pts.length-1)/2;
  pts.forEach((p,i)=>{ g+=`<rect class="hit" data-i="${i}" x="${(xAt(i)-half).toFixed(1)}" y="${PT}" width="${Math.max(half*2,12).toFixed(1)}" height="${plotH}" fill="transparent" style="cursor:pointer"/>`; });
  // X 轴标签按实测可用宽度排布，并从右端往左取：末端一定有标签，间距均匀。
  const labelStep=Math.max(1,Math.ceil(pts.length/Math.max(2,Math.floor(plotW/74))));
  for(let i=lastI;i>=0;i-=labelStep) g+=T(xAt(i),H-10,pts[i].label,'font-size:10px;fill:var(--text-muted)','middle');

  wrap.innerHTML=`<svg width="${w}" height="${H}" style="display:block;overflow:visible">${g}</svg>
    <div id="tip"></div><div id="cross" style="position:absolute;opacity:0;top:${PT}px;height:${plotH}px;width:1px;background:var(--border-strong);pointer-events:none"></div>`;
  const tip=$('#tip'), cross=$('#cross');
  wrap.querySelectorAll('.hit').forEach(h=>{
    h.addEventListener('mouseenter',()=>{
      const p=pts[+h.dataset.i], S=TREND_SERIES;
      const [up,low]=TREND_BENCHMARKS, v=p.rollPct==null?p.cumPct:p.rollPct;
      const which=p.rollPct==null?S.cum.label:S.roll.label;
      const verdict = v<=low.pct ? `<div style="color:${low.color}">${which}已达目标（≤${low.pct}%）</div>`
        : v<=up.pct ? `<div style="color:${low.color}">${which}在${up.label}区 · 距${low.label} ${low.pct}% 还差 ${(v-low.pct).toFixed(1)}</div>`
        : `<div style="color:${up.color}">${which}超出${up.label}线 ${up.pct}% +${(v-up.pct).toFixed(1)}</div>`;
      tip.innerHTML=`<div style="color:var(--text-2)">${p.label}</div>
        <div style="color:${S.cum.color}">${S.cum.label} ${p.cumPct}% <span style="color:var(--text-muted)">(${p.cumDiv}/${p.cumN})</span></div>
        <div style="color:${S.roll.color}">${S.roll.label} ${p.rollPct==null?'样本不足':p.rollPct+'%'}${p.rollPct==null?'':` <span style="color:var(--text-muted)">(${p.rollDiv}/${p.rollN})</span>`}</div>
        <div style="color:var(--text-muted)">${p.hasData?`本时段新增 ${p.divergent} / ${p.comparable}`:'本时段无新工单（累计值保持不变）'}</div>${verdict}`;
      tip.style.opacity=1; tip.style.top='6px';
      tip.style.left=Math.min(Math.max(xAt(+h.dataset.i)+12,0),Math.max(w-210,0))+'px';
      cross.style.opacity=1; cross.style.left=xAt(+h.dataset.i).toFixed(1)+'px';
    });
    h.addEventListener('mouseleave',()=>{tip.style.opacity=0;cross.style.opacity=0});
  });
}

  resolved: {tint:'rgba(20,184,166,.15)', fg:'var(--teal)',          border:'var(--success-strong)',num:'var(--teal)',         label:'RESOLVED'},
  P1:       {tint:'rgba(239,68,68,.15)',  fg:'var(--danger)',        border:'var(--danger-strong)', num:'var(--danger)',       label:'CRITICAL'},
  P2:       {tint:'rgba(249,115,22,.15)', fg:'var(--warn-orange)',   border:'var(--warn-orange)',   num:'var(--warn-orange)',  label:'HIGH'},
  P3:       {tint:'rgba(234,179,8,.15)',  fg:'var(--warn-softer)',   border:'var(--warn-alt)',      num:'var(--warn-alt)',     label:'MEDIUM'},
  P4:       {tint:'rgba(16,185,129,.15)', fg:'var(--success)',       border:'var(--success-strong)',num:'var(--success)',      label:'LOW'},

  divergent:{tint:'rgba(139,92,246,.15)', fg:'var(--purple)',        border:'var(--purple)',        num:'var(--purple)',       label:'DIVERGENT'},
};
function statCard(key,cn,num,sub,pin){
  const t=STAT_TONES[key];
  const on = ['P1','P2','P3','P4'].includes(key) ? gradeFilter===key : scopeFilter===key;
  const bars=[...Array(14)].map((_,i)=>
    `<i style="height:${(4+Math.abs(Math.sin(i*1.7+key.length))*18).toFixed(1)}px;opacity:${i>9?'.95':'.45'}"></i>`).join('');
  return `<div class="stat-card${on?' active':''}" data-stat="${key}"
    style="--cat:${t.border};--catTint:${t.tint};--catFg:${t.fg};--catNum:${t.num};--catRing:${t.tint}">
    <div class="sc-head">
      <span class="sc-en">${t.label}${on?'<span class="sc-on">ON</span>':''}${pin||''}</span>
      <span class="sc-num">${num}</span>
    </div>
    <div class="sc-body">
      <div class="sc-row"><span class="sc-cn">${cn}</span><span class="sc-sub">${sub||''}</span></div>
      <div class="spark">${bars}</div>
    </div>
  </div>`;
}

function passFilter(t){
  if(gradeFilter!=='全部' && t.grade!==gradeFilter) return false;
  if(scopeFilter==='pending' && !['pending_approval','processing'].includes(t.status)) return false;
  if(scopeFilter==='resolved' && ['pending_approval','processing'].includes(t.status)) return false;
  if(scopeFilter==='divergent' && !t.divergent) return false;
  if(FILT.status==='已完成' && t.status!=='completed') return false;
  if(FILT.status==='自动归档' && t.status!=='closed_false_positive') return false;
  if(FILT.crit!=='全部' && CRIT[t.crit]!==FILT.crit) return false;
  if(FILT.ai!=='全部' && AIV[t.ai]!==FILT.ai) return false;
  if(FILT.mssp!=='全部' && MSSPV[t.mssp]!==FILT.mssp) return false;
  if(SEARCH){
    const q=SEARCH.toLowerCase();
    if(!(t.id+' '+t.alert+' '+t.rule+' '+t.host+' '+t.ip+' '+t.src).toLowerCase().includes(q)) return false;
  }
  return true;
}
function sortRows(rows){
  // 「误报可能↓」把判真实但历史命中率低的过度升级项顶到前面，便于批量复核。
  if(SORT==='fp') return rows.slice().sort((a,b)=>(b.fp||0)-(a.fp||0));
  return rows.slice().sort((a,b)=>b.ts.localeCompare(a.ts));
}
function agentCell(t){
  const auto=t.status==='closed_false_positive';
  return `<div class="r"><span class="s">${auto?'自动归档 · 跳过二线':'完成 · 4 节点'}</span><span class="p">100%</span></div>
    <div class="trk"><i style="width:100%;background:var(--success-strong)"></i></div>`;
}
function fpCell(t){
  if(t.fp==null) return '<span class="mono" style="font-size:10px;color:var(--border-strong)">—</span>';
  const pct=Math.round(t.fp*100);
  const fg = pct>=80?'var(--warn-softer)':pct>=60?'var(--warn-soft)':'var(--text-2)';
  return `<div class="fpcell" title="校准「误报可能」${pct}%（n=${t.fpN}，${t.fpSource}）。判真实时 = 1 − 校准置信；仅作复核优先级参考，非自动关单依据。">
    <div class="trk"><i style="width:${pct}%;background:${fg}"></i></div>
    <span class="v" style="color:${fg}">${pct}%</span></div>`;
}

/* ===================== 事件详情 ===================== */
function scoreColor(v){ return v>=70?'var(--danger)':v>=40?'var(--warn-softer)':'var(--success)'; }
function rawBlock(obj){
  const json=JSON.stringify(obj,null,2)
    .replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))
    .replace(/"([^"]+)":/g,'<span class="ky">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="st">"$1"</span>')
    .replace(/: (-?\d+(?:\.\d+)?|true|false|null)/g,': <span class="nu">$1</span>');
  return `<details class="raw"><summary>完整输出 · RAW</summary><pre>${json}</pre></details>`;
}
function tok(a,b){ return `<span class="mono">${(a/1000).toFixed(1)}K in / ${(b/1000).toFixed(1)}K out</span>`; }

function intelCard(t){
  const i=t.intel;
  if(i.skipped){
    return `<div class="card"><h3>威胁情报 · INTEL-β</h3>
      <div class="out-summary" style="margin-top:0">${esc(i.summary)}</div>
      <div class="note info">⊘ 无公网 IOC → 跳过情报查询。这是刻意设计的省钱路径：情报 API 按次计费，内网到内网的流量查了也不会有结果。</div></div>`;
  }
  const srcs=i.srcs.map(s=>{
    const v=s[1], err=(v==='ERR');
    return `<div class="srcrow"><span class="nm">${esc(s[0])}</span>
      <span class="sc" style="color:${err?'var(--warn-softer)':scoreColor(v)}">${err?'查询失败':v}</span></div>`;
  }).join('');
  const hasErr=i.srcs.some(s=>s[1]==='ERR');
  return `<div class="card">
    <h3>威胁情报 · INTEL-β<span class="pin">5<span class="tip">三个情报源并发查询（微步在线 / VirusTotal / AbuseIPDB），恶意评分取各源最大值而非叠加 —— 叠加会让「三个源都给 30 分」被算成高危。</span></span></h3>
    ${srcs}
    <div class="scorebox">
      <div style="display:flex;justify-content:space-between"><span class="muted" style="font-size:11px">恶意评分（取最大）</span>
        <span class="mono" style="font-weight:700;color:${scoreColor(i.score)}">${i.score}/100</span></div>
      <div class="bar"><i data-w="${i.score}" style="background:${scoreColor(i.score)}"></i></div>
    </div>
    <div class="out-summary">${esc(i.summary)}</div>
    ${hasErr?'<div class="note warn">⚠ 部分情报源查询失败，评分按已成功的源计算。失败不等于「无恶意」—— 二线会把它当作证据缺口而不是阴性结论。</div>':''}
  </div>`;
}
function assetCard(t){

    <h3>▲ 来源<span class="pin">6<span class="tip">攻击方与受害方必须分开标注。F5 负载均衡器的 SNAT 出口常被日志记成「源 IP」，照着封禁就等于切断业务入口 —— 平台会显式标出这类角色。</span></span></h3>
    <div class="kv"><span class="k">源</span><span class="v">${esc(t.src)}</span></div>

function nodeIntel(t){
  const i=t.intel;
  if(i.skipped) return {cls:'skip',glyph:'hex',shape:'β',code:'INTEL-β',name:'情报专家',
    model:null,stat:'已跳过',statCls:'skip',meta:`耗时 ${i.elapsed.toFixed(2)}s · 0 Token · 无公网 IOC`,
    body:`<div class="out-summary" style="margin-top:0">${esc(i.summary)}</div>`};
  return {cls:'done',glyph:'hex',shape:'β',code:'INTEL-β',name:'情报专家',
    model:i.model,esc:i.model.includes('sonnet'),stat:'✓ 完成',statCls:'ok',
    meta:`耗时 ${i.elapsed.toFixed(2)}s · ${((i.tin+i.tout)/1000).toFixed(1)}K Token · 恶意评分 ${i.score}`,
    body:`<div class="fields">
      <div class="field"><div class="lab">是否恶意</div><div class="val" style="color:${i.malicious?'var(--danger)':'var(--success)'}">${i.malicious?'是':'否'}</div></div>
      <div class="field"><div class="lab">恶意评分 / Token</div><div class="val" style="font-size:12px">${i.score} · ${tok(i.tin,i.tout)}</div></div>
    </div>
    <div class="out-summary">${esc(i.summary)}</div>
    ${rawBlock({malicious_score:i.score,is_malicious:i.malicious,sources:i.srcs.map(s=>({name:s[0],score:s[1]}))})}`};
}
function nodeTier1(t){
  const d=t.tier1, fp=d.verdict==='误报';
  return {cls:'done',glyph:'tri',shape:'α',code:'ANALYST-α',name:'一线分析师',
    model:d.model,esc:false,stat:'✓ 完成',statCls:'ok',
    meta:`耗时 ${d.elapsed.toFixed(2)}s · ${((d.tin+d.tout)/1000).toFixed(1)}K Token · ${d.verdict} / 建议${d.advice}`,
    body:`<div class="fields">
      <div class="field"><div class="lab">分类判定</div><div class="val" style="color:${fp?'var(--text-2)':'var(--warn-softer)'}">${esc(d.verdict)}</div></div>
      <div class="field"><div class="lab">置信度 / 分流</div><div class="val" style="font-size:12px">${d.conf} · ${esc(d.advice)}</div></div>
      <div class="field full"><div class="lab">CMDB 资产重要性</div><div class="val" style="font-weight:400;font-size:12px">${esc(d.assetCrit)}</div></div>
    </div>
    <div class="out-summary">${d.reasons.map(r=>'· '+esc(r)).join('<br>')}</div>
    ${rawBlock({verdict:d.verdict,asset_criticality:d.assetCrit,recommendation:d.advice,confidence:d.conf})}`};
}
function nodeHunter(t){
  const d=t.hunter;
  if(!d) return {cls:'skip',glyph:'dia',shape:'γ',code:'HUNTER-γ',name:'二线猎手 · 研判指挥',
    model:null,stat:'未介入',statCls:'skip',meta:'一线高置信误报 + 校准门控通过 · 0 Token',
    body:`<div class="out-summary" style="margin-top:0">命中自动归档条件，二线不介入。自动归档路径的分歧率（9.4%）明显低于走完整二线研判的路径（19.8%）—— 能确定性判掉的就别交给模型。</div>`};
  return {cls:'done',glyph:'dia',shape:'γ',code:'HUNTER-γ',name:'二线猎手 · 研判指挥',
    model:d.model,esc:d.esc,stat:'✓ 完成',statCls:'ok',
    meta:`耗时 ${d.elapsed.toFixed(2)}s · ${((d.tin+d.tout)/1000).toFixed(1)}K Token · 定级 ${t.grade} / 置信 ${t.conf}`,
    body:`<div class="fields">
      <div class="field"><div class="lab">最终定级</div><div class="val">${gradeBadge(t.grade)}</div></div>
      <div class="field"><div class="lab">横向扩散</div><div class="val" style="font-size:12px">${esc(d.lateral)}</div></div>
      <div class="field full"><div class="lab">攻击链</div>
        <div class="chain">${d.chain.map((x,k)=>(k?'<span class="arr">→</span>':'')+'<span>'+esc(x)+'</span>').join('')}</div></div>
      <div class="field full"><div class="lab">MITRE ATT&amp;CK</div>
        <div class="tags">${d.attck.length?d.attck.map(a=>'<span class="tag">'+esc(a)+'</span>').join(''):'<span class="muted" style="font-size:11.5px">无证据支持的战术 —— 宁可留空也不硬凑</span>'}</div></div>
    </div>
    <div class="out-summary">${esc(d.summary)}</div>
    ${d.esc?'<div class="note info">↑ 基础档 sonnet-4-6 置信不足，已自动升级 opus-4-8 复核后出结论。</div>':''}

function nodeFinal(t){
  if(t.humanReview){
    const h=t.humanReview;
    return {cls:'human',glyph:'sq',shape:'Ω',code:'COMMANDER-Ω',name:'事件指挥官 · 人工决策',
      model:null,stat:'已裁定',statCls:'skip',human:true,meta:`${h.at} · ${h.operator} · 不消耗 Token`,
      body:`<div class="out-summary" style="margin-top:0">值班主管复核后执行「${esc(h.action)}」并闭环。
        <br><span class="muted">人工裁定过的工单退出分歧分母 —— 两边都是人判的，谈不上 AI 与 MSSP 分歧。</span></div>`};
  }
  if(t.autoClose){
    const cal=t.calibration;
    return {cls:'skip',glyph:'sq',shape:'◎',code:'AUTO-CLOSE',name:'AI 自动决策',
      model:null,stat:'已归档',statCls:'skip',meta:`确定性门控 · 0 Token · ${t.autoClose}`,
      body:`<div class="out-summary" style="margin-top:0">${esc(t.disposalOverride||'已自动归档。')}</div>
        ${cal?`<div class="note info">校准门控：同规则历史样本 n=${cal.n}，误报率 p=${cal.p}，来源 ${cal.source} → 满足自动归档阈值。基础设施故障（超时 / 配额耗尽）不会走这条路，而是标 error 等待重试，避免把故障伪造成「低危」。</div>`:''}`};
  }
  return {cls:'done',glyph:'sq',shape:'◎',code:'AUTO-CLOSE',name:'AI 自动决策',
    model:null,stat:'✓ 已闭环',statCls:'ok',meta:'P3 / P4 自动闭环 · 不消耗 Token',
    body:`<div class="out-summary" style="margin-top:0">${GRADE[t.grade]} 由 AI 自动闭环转入持续监控。P1 / P2 才会进入待审批并推送飞书（P1 加电话）。</div>`};
}

function adjudication(t){
  const summary = t.hunter ? t.hunter.summary : t.summaryOverride;
  const actions = t.hunter ? t.hunter.actions : null;
  const evidence = t.tier1.reasons;
  const blockedNote = t.blocked==='blocked'
    ? '<div class="note ok">✓ 日志实证已拦截（WAF action=2 / 规则名含 Blocked）。「被拦截 / 未得逞」不等于误报 —— 攻击行为属实，只是没得手，仍按最低 P3 记录。</div>'
    : t.blocked==='not_blocked'
      ? '<div class="note warn">⚠ 日志实证未拦截（WAF action=0 为放行）。不得从含义未确认的数字反推拦截，也不得写出日志里没出现过的设备或厂商名。</div>' : '';
  return `<div class="card">
    <h3>Adjudication · 处置决策<span class="pin">7<span class="tip">最终定级与处置。P1/P2 在此二次确认后执行并推送飞书；P3/P4 自动闭环；命中确定性门控的直接归档。人工随时可以介入改判。</span></span></h3>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      ${gradeBadge(t.grade,t.conf)}
      <span class="chip ${t.ai}">${AIV[t.ai]}</span>
    </div>
    <div class="adj-sum">${esc(summary)}</div>
    ${blockedNote}
    ${t.divergent?`<div class="note warn">⇄ <b>研判分歧</b>：AI 判「${AIV[t.ai]}」，MSSP 结论「${MSSPV[t.mssp]}」。分歧卡片会推送到复盘群（标注无需处置），不进告警群。</div>`:''}
    ${actions?`<div style="margin-top:12px"><div class="eyebrow">建议处置动作</div>
      <div class="tags" style="margin-top:7px">${actions.map(a=>'<span class="act">'+esc(a)+'</span>').join('')}</div></div>`:''}
    <div class="dispbtns">
      ${t.humanReview
        ? '<button class="btn full ghost" onclick="toast(\'打开人工裁定记录（演示）\')">查看人工裁定记录</button>'
        : `<button class="btn full primary" onclick="toast('已确认闭环并下发处置（演示）')">确认执行</button>
           <button class="btn full danger ghost" onclick="toast('已标记为误报并关闭（演示）')">标记为误报并关闭</button>`}
      <button class="btn full ghost" onclick="toast('打开「调整事件最终定级」（演示）')">调整事件最终定级</button>
    </div>
  </div>
  <div class="card">
    <h3>关键证据</h3>
    ${evidence.map(e=>`<div class="evi"><span class="b">▸</span><span>${esc(e)}</span></div>`).join('')}
  </div>
  <div class="card">
    <h3>MSSP 原始描述</h3>
    <div class="out-summary" style="margin-top:0">${esc(t.situation)}</div>
    <div class="kv" style="margin-top:10px"><span class="k">MSSP 结论</span><span class="v">${chip(t.mssp,MSSPV,'未定结')}</span></div>
  </div>`;
}

function renderDetail(id){

  const totalTok=(t.intel.tin+t.intel.tout)+(t.tier1.tin+t.tier1.tout)+(t.hunter?t.hunter.tin+t.hunter.tout:0);
  const nodes=[nodeIntel(t),nodeTier1(t),nodeHunter(t),nodeFinal(t)];

  $('#topbar').innerHTML=topbarHTML(
    ['运营', `<span style="cursor:pointer" onclick="nav('list')">SOC Hub</span>`, `<span>${t.id}</span>`],
    t.alert,
    `<button class="btn sm" onclick="nav('list')">← 返回列表</button>`);

  $('#screen').innerHTML=`<div class="page">
    <div class="notes-banner">📌 事件详情三栏：左 = 来源角色 + 威胁情报 + CMDB 资产；中 = 三个 AI Agent 的完整研判链路（可展开 RAW 输出）；右 = 最终定级、关键证据与 MSSP 原始描述。</div>

        <div style="font-size:19px;font-weight:800;margin-top:3px">${esc(t.alert)}</div>
        <div class="mono" style="font-size:11px;color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere;max-width:860px">${esc(t.rule)}</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${gradeBadge(t.grade,t.conf)}
        <span class="chip ${t.status==='closed_false_positive'?'skip':'ok'}">${STATUS[t.status]}</span>
        ${t.divergent?'<span class="chip indeterminate">⇄ 研判分歧</span>':''}
      </div>
    </div>
    <div class="detail-grid">
      <div>${assetCard(t)}${intelCard(t)}</div>
      <div>
        <div class="card" style="margin-bottom:8px">
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap">
            <div>
              <div class="eyebrow">AI Agent · 处置流水线</div>
              <div class="ptitle">多角色协同分析</div>
            </div>
            <div class="mono" style="margin-left:auto;font-size:11px;color:var(--text-muted)">
              总耗时 ${t.secs}s · ${(totalTok/1000).toFixed(1)}K Token
              <span class="pin">10<span class="tip">INTEL-β 与 ANALYST-α 并发执行（asyncio.gather），HUNTER-γ 串在它们之后。所以总耗时小于三者相加。</span></span>
            </div>
          </div>
          <div class="tl">${nodes.map(nodeHTML).join('')}</div>
        </div>
        <div class="plfoot">└ ${t.humanReview?'人工裁定 · 事件闭环':'AI 自动决策 · 事件闭环'}</div>
      </div>
      <div>${adjudication(t)}</div>
    </div>
  </div>`;
  bindCtrl();
  requestAnimationFrame(()=>document.querySelectorAll('.bar > i').forEach(i=>{if(i.dataset.w)i.style.width=i.dataset.w+'%'}));

    ],
  },
  HUNTER:{

    prompt:[

      '## 输入信号来源（按权重）',

      '- **情报评分**：INTEL-β 的 malicious_score 仅反映 IOC 的情报库命中度。',

      '## 一、"被拦截 / 未得逞"不是误报',

      '已登记的 F5 SNAT 网段（5 个 /23 段）出现在 src_ip 位置时，**不是真实攻击发起方**：',

      '- 重复次数按**同源归并**后计算：同一规则在不同数据源重复上报的，算一次。',

      '- **P2**：本地强信号但资产非核心，或证据需进一步验证。',
      '- **P3**：存在风险但证据不足确认失陷（含"行为属实但被拦截"）。',

      '## MITRE ATT&CK 映射（必填）',

      '- 每项为 `{id, name, tactic}` 对象；证据不足时输出空数组 `[]`。','',
      '输出格式（末行必须严格遵守）：',
      '[定级: P1/P2/P3/P4] | [置信度: 0-100] | [处置: 具体处置建议] | [摘要: 不超过200字的研判摘要]',

  },
  COMMANDER:{
    code:'COMMANDER-Ω', short:'Ω', cn:'事件指挥官', ico:'linear-gradient(135deg,#7C3AED,#4C1D95)',
    tag:'人工研判 · 最终决策 · 事件闭环', cardModel:'人工审批', cardTok:'不消耗', human:true,

const CFG_ORDER=['INTEL','ANALYST','HUNTER','COMMANDER'];
let CFG_SEL='HUNTER';

const CFG_APIS=[
  {nm:'微步在线 ThreatBook',   today:'今日调用 48',   probe:'ip/query · domain/query · file/report'},
  {nm:'VirusTotal',            today:'今日调用 31',   probe:'探活 2m 前 · 934ms'},
  {nm:'AbuseIPDB',             today:'今日调用 12',   probe:'探活 2m 前 · 750ms'},
  {nm:'NetBox CMDB API',       today:'资产数 2,720',  probe:'IP 条目 4,006 · 探活 11m 前'},
];
const CFG_SOP=[
  ['SOP-001','恶意软件感染','malware','P2','×1.5','隔离受感染主机 · 提取内存镜像'],
  ['SOP-002','暴力破解 / 密码喷洒','bruteforce','P3','×1.0','封锁源 IP · 强制 MFA · 检查账户锁定'],
  ['SOP-003','命令与控制通信','c2','P1','×2.0','立即隔离主机 · 封禁 C2 IP / 域名'],
  ['SOP-004','横向移动','lateral_movement','P1','×1.8','检查认证日志 · 扫描受影响网段'],
  ['SOP-005','数据渗出','exfiltration','P1','×2.0','封锁出口流量 · 联系数据安全团队'],
  ['SOP-006','侦察扫描','recon','P4','×0.8','确认边界拦截状态 · 记录扫描模式'],
  ['SOP-007','漏洞利用尝试','intrusion','P2','×1.5','检查 WAF 日志 · 确认对应漏洞是否存在'],
];

function promptLine(raw,i){
  let s;
  if(/^##\s+/.test(raw)) s='<span class="ph">'+esc(raw.replace(/^##\s+/,''))+'</span>';
  else s=esc(raw).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<span class="pc">$1</span>');
  return `<div class="prow"><span class="pn">${i+1}</span><span class="pt">${s||'&nbsp;'}</span></div>`;
}
function promptPanel(a){
  return `<div class="card">
    <div class="sphead">
      <div style="width:30px;height:30px;font-size:13px;border-radius:8px;background:${a.ico};color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700">${a.short}</div>
      <div><div class="eyebrow">System Prompt · ${a.code}<span class="pin">11<span class="tip">系统提示词即产品配置本身。规则护栏（已拦截的证据要求、SNAT 禁封、AI 工具良性、自身排除）都写在这里，改提示词前须先跑离线 A/B 回放验证。</span></span></div></div>
    </div>
    <div class="sp-desc">${esc(a.desc)}</div>
    <div class="sp-meta">token ${a.ptok} · 行 ${a.plines}</div>
    <div class="promptbox">${a.prompt.map(promptLine).join('')}</div>
  </div>`;
}
function humanPanel(a){
  const DEC=[['01','确认执行','按 AI 建议处置，闭环工单'],['02','降级处置','调整为更低定级后闭环'],
    ['03','升级响应','调整为更高定级，触发紧急通知'],['04','标记误报','判定为误报，关闭并记录原因']];
  return `<div class="card">
    <div class="sphead">
      <div style="width:30px;height:30px;font-size:13px;border-radius:8px;background:${a.ico};color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700">${a.short}</div>
      <div><div class="eyebrow" style="color:var(--warn)">Human Node · ${a.code}</div></div>
    </div>
    <div class="sp-desc">基于三个 AI 角色的分析结论，由值班安全主管做出最终处置决策：确认 / 降级 / 升级 / 标记误报。</div>
    <div class="hnode">
      <div class="av">☺</div>
      <div class="t">人工审批节点</div>
      <div class="d">COMMANDER-Ω 不运行 AI 模型，也没有系统提示词。值班主管在事件详情页看完三角色结论后做出最终决策。人工裁定过的工单会退出 AI-vs-MSSP 分歧统计的分母。</div>
      <div class="decbox">
        <div class="dt">决策选项</div>
        ${DEC.map(d=>`<div class="decitem"><span class="no">${d[0]}</span><div><div class="dn">${d[1]}</div><div class="dd2">${d[2]}</div></div></div>`).join('')}
      </div>
    </div>
    <div class="note warn" style="max-width:620px;margin:16px auto 0">ⓘ P1 / P2 完成 AI 分析后自动进入<b>待审批</b>并推送飞书（P1 另加电话）。P3 / P4 由 AI 自动闭环，主管仍可随时介入改判。</div>
  </div>`;
}
function modelPanel(a){
  const p=a.params;
  const rows=[['模型',p.model],['Max Tokens',p.max],['超时',p.to],
    ['升级模型',p.esc==='—'?'<span class="muted">—</span>':`<span style="color:var(--purple)">${p.esc}</span>`],['SEP'],
    ['累计调用',`<span style="color:var(--accent)">${p.calls}</span>`],['输入 / 输出 Token',p.io],
    ['平均耗时',p.avg],['最近耗时',p.last],['截断次数',p.trunc],
    ['超时次数',`<span style="color:${p.tout==='0'?'var(--text-bright)':'var(--danger)'}">${p.tout}</span>`]];
  return `<div class="card">
    <div class="eyebrow">Model · 模型参数</div><div class="ptitle">运行时配置</div>
    ${rows.map(r=>r[0]==='SEP'?'<div style="height:1px;background:var(--border);margin:9px 0"></div>'
      :`<div class="kv"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}
    <div class="note info">ⓘ 模型经 ModelVerse（Bedrock 代理）调用。opus-4.x 不接受 temperature 参数，该路径已去掉；sonnet-5 因思考预算挤占输出已永久排除。</div>
  </div>`;
}
function auditPanel(){
  const rows=[['节点类型','<span style="color:var(--warn-softer)">人工审批 · 不消耗 Token</span>'],
    ['触发定级','P1 / P2'],['自动闭环范围','P3 / P4'],
    ['P1 通知','<span style="color:var(--danger)">飞书 + 电话</span>'],
    ['P2 通知','<span style="color:var(--warn-softer)">飞书</span>'],
    ['响应 SLA','P1 ≤ 15min · P2 ≤ 60min'],['SEP'],
    ['待审批工单','<span style="color:var(--warn-softer)">3</span>'],
    ['已闭环工单','<span style="color:var(--success)">288</span>'],
    ['累计工单','291'],['P1 / P2 累计','2 / 9']];
  return `<div class="card">
    <div class="eyebrow">Audit · 审批策略</div><div class="ptitle">人工决策配置</div>
    ${rows.map(r=>r[0]==='SEP'?'<div style="height:1px;background:var(--border);margin:9px 0"></div>'
      :`<div class="kv"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}
  </div>`;
}
function apiPanel(){
  return `<div class="card">
    <div class="eyebrow">API · 外部接入</div><div class="ptitle">情报源与资产库</div>
    ${CFG_APIS.map(s=>`<div class="apisrc">
      <div class="r1"><span class="nm">${esc(s.nm)}</span><span class="on"><span class="pulse"></span>ONLINE</span></div>
      <div class="r2"><span>${esc(s.today)}</span><span>${esc(s.probe)}</span></div>
    </div>`).join('')}
    <div class="note warn">⚠ 健康探针只看 HTTP 状态是不够的 —— 授权过期的情报源会稳定返回 200 并附带错误体，仪表盘照样是绿的。探针须断言响应体里的判定字段存在。</div>
  </div>`;
}
function renderConfig(){
  $('#topbar').innerHTML=topbarHTML(['运营','Agent 配置'],'Agent 配置中心',
    `<button class="btn sm">导出 YAML</button>`);
  const a=CFG_AGENTS[CFG_SEL];
  const cards=CFG_ORDER.map(k=>{
    const g=CFG_AGENTS[k], on=k===CFG_SEL;
    const stat=g.human?'<span class="st hu">人工</span>':'<span class="st on"><span class="pulse"></span>在线</span>';
    const body=g.human
      ? `<div class="btns">${['确认','降级','升级','误报'].map((b,i)=>`<span class="abtn" style="${i===0?'color:var(--success);border-color:rgba(16,185,129,.3)':i===3?'color:var(--danger);border-color:rgba(239,68,68,.3)':'color:var(--warn-softer);border-color:rgba(245,158,11,.3)'}">${b}</span>`).join('')}</div>`
      : `<div class="mrow"><div><div class="lab">模型</div><div class="val">${g.cardModel}</div></div><div><div class="lab">累计输入 Token</div><div class="val">${g.cardTok}</div></div></div>`;
    return `<div class="agc${on?' sel':''}${g.human?' humanc':''}" onclick="selectCfg('${k}')">
      <div class="top">
        <div class="ico" style="background:${g.ico}">${g.short}</div>
        <div><div class="cd">${g.code}</div><div class="cn">${g.cn}</div></div>
        ${stat}
      </div>
      <div class="tg">${esc(g.tag)}</div>
      ${body}
    </div>`;
  }).join('');

  $('#screen').innerHTML=`<div class="page">
    <div class="notes-banner">📌 点顶部四张卡片切换。三个 AI Agent 展示系统提示词与运行时模型参数；COMMANDER-Ω 是<b>人工审批节点</b>，不运行模型、无提示词，配的是审批策略与 SLA。底部为 SOP 告警类型 → 处置策略映射。</div>
    <div class="agrow">${cards}</div>
    <div class="cfg2">
      <div>${a.human?humanPanel(a):promptPanel(a)}</div>
      <div>${(a.human?auditPanel():modelPanel(a))+apiPanel()}</div>
    </div>
    <div class="card">
      <h3>SOP · 标准作业流程 —— 告警类型 → 处置策略映射</h3>
      <table class="tickets sop">
        <thead><tr><th style="width:74px">规则</th><th>名称</th><th>类别</th><th>升级阈值</th><th>优先级</th><th>自动处置</th></tr></thead>
        <tbody>${CFG_SOP.map(r=>`<tr>
          <td class="mono muted">${r[0]}</td><td>${esc(r[1])}</td>
          <td><span class="chip skip">${r[2]}</span></td>
          <td>${gradeBadge(r[3])}</td>
          <td class="mono muted">${r[4]}</td><td>${esc(r[5])}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
  bindCtrl();
}
window.selectCfg=k=>{CFG_SEL=k;renderConfig();$('#screen').scrollTop=0};

/* ===================== 公共控件 ===================== */
function topbarHTML(crumbs,title,right){
  const c = crumbs.map((x,i)=> i===crumbs.length-1 ? `<span class="cur">${x}</span>` : `<span>${x}</span>`)
                  .join('<span class="sep">/</span>');
  return `<div class="tbleft"><div class="crumb">${c}</div><h1>${esc(title)}</h1></div>
    <div class="spacer"></div>
    <span class="demoPill">交互演示</span>
    <div class="syncPill"><span class="pulse"></span><span class="lb">MSSP 同步</span><span class="sep">·</span><span class="vl">上次同步 45s 前</span>
      <span class="pin">8<span class="tip">后端按 600 秒轮询 MSSP 拉取新工单并回写人工结论。MSSP 结论通常晚于 AI 研判数天到达，所以「分歧」只能在结论同步时才判定得出来。</span></span>
    </div>
    ${ctrlHTML()}${right||''}`;
}
function ctrlHTML(){
  return `<div class="toggle" id="notesToggle" title="显示功能讲解注释"><span>讲解</span><span class="switch"></span></div>`;
}
function bindCtrl(){
  const tg=$('#notesToggle');
  if(tg){ if(document.body.classList.contains('notes-on')) tg.classList.add('on');
    tg.addEventListener('click',()=>{document.body.classList.toggle('notes-on');tg.classList.toggle('on')}); }
}

/* 侧栏底部的主题三段开关：深色 / 跟随系统 / 浅色 —— 与真实产品一致，
   切换只改 <html data-theme>，所有颜色都走设计令牌，没有第二套样式表。 */
const MQ = window.matchMedia('(prefers-color-scheme: dark)');
let THEME = 'light';
function applyTheme(){
  document.documentElement.dataset.theme = THEME==='system' ? (MQ.matches?'dark':'light') : THEME;
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.th===THEME));
}
MQ.addEventListener('change',()=>{ if(THEME==='system') applyTheme(); });
document.querySelectorAll('#themeSeg button').forEach(b=>b.addEventListener('click',()=>{THEME=b.dataset.th;applyTheme()}));
$('#collapseBtn').addEventListener('click',()=>document.body.classList.toggle('side-collapsed'));
applyTheme();
let toastTimer;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{
  if(n.classList.contains('disabled')) return;
  nav(n.dataset.nav);
}));
renderList();
</script>
