<script>
/* Capability-portfolio summary for the AI Security Panorama.
   Injected below the strategic-core caption; clicking a category highlights
   its member products. Observes the document and re-applies on every render. */
(function(){
  if (window.__capSum) return; window.__capSum = 1;
  var IDS = ["cyber-incident-hub","multiagent-cowork","identity-hub","useract","vulnerability-hub","emailguard","pentest-openclaw","ai-safety-platform","ai-risk-framework","digital-human","ai-guardrails","ai-gateway","github-leak","ai-shift-assessment","ai-red-teaming"];
  var GROUPS = [
    { key:"plugin",  zh:"插件", en:"Add-in",  n:1, ids:["emailguard"] },
    { key:"product", zh:"产品", en:"Product", n:2, ids:["multiagent-cowork","ai-guardrails"] },
    { key:"system",  zh:"系统", en:"System",  n:3, ids:["cyber-incident-hub","identity-hub","vulnerability-hub"] },
    { key:"tool",    zh:"工具", en:"Tool",    n:4, ids:["useract","pentest-openclaw","github-leak","ai-shift-assessment"] }
  ];
  var HL  = "background:#E6F4EC;border-radius:6px;box-shadow:0 0 0 3px #E6F4EC,0 0 0 5px #00963B;";
  var OFF = "display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 13px;border:1px solid #E1E7EC;border-radius:9px;background:#FFFFFF;cursor:pointer;transition:all .15s;";
  var ON  = "display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 13px;border:1px solid #00AA4F;border-radius:9px;background:#EAF7EF;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(0,170,79,0.18);";
  var active = null, userLang = null;
  function bg(btn){ try { return btn ? window.getComputedStyle(btn).backgroundColor : ""; } catch(e){ return ""; } }
  function clearC(c){ return !c || c === "transparent" || c.indexOf("rgba(0, 0, 0, 0)") >= 0; }
  function isZh(){
    if (userLang) return userLang === "zh";
    var btns = document.querySelectorAll("button"), zh = null, en = null;
    for (var i = 0; i < btns.length; i++){ var t = (btns[i].textContent || "").replace(/\s+/g, ""); if (t === "中") zh = btns[i]; else if (t === "EN") en = btns[i]; }
    var zc = bg(zh), ec = bg(en);
    if (!clearC(zc) && clearC(ec)) return true;
    if (!clearC(ec) && clearC(zc)) return false;
    var b = document.body ? document.body.textContent : "";
    return (b.indexOf("状态说明") >= 0 || b.indexOf("赋能安全") >= 0 || b.indexOf("点击任意产品") >= 0);
  }
  function grid(){ return document.querySelector(".panorama-grid"); }
  function anchors(){ var g = grid(); return g ? Array.prototype.slice.call(g.querySelectorAll("a[href]")) : []; }
  function stamp(){ var a = anchors(); if (a.length !== IDS.length) return false; for (var i=0;i<a.length;i++){ a[i].setAttribute("data-pid", IDS[i]); } return true; }
  function elFor(id){ var a = anchors(); for (var i=0;i<a.length;i++){ if (a[i].getAttribute("data-pid") === id) return a[i]; } return null; }
  function clearHL(){ var r = document.querySelectorAll("[data-hlr]"); for (var i=0;i<r.length;i++){ r[i].style.cssText = r[i].getAttribute("data-hlo") || ""; r[i].removeAttribute("data-hlr"); r[i].removeAttribute("data-hlo"); } }
  function applyHL(){
    clearHL();
    var it = document.querySelectorAll("[data-grp]");
    for (var i=0;i<it.length;i++){ it[i].style.cssText = (it[i].getAttribute("data-grp") === active) ? ON : OFF; }
    if (!active) return;
    var g = null; for (var k=0;k<GROUPS.length;k++){ if (GROUPS[k].key === active) g = GROUPS[k]; }
    if (!g) return;
    for (var j=0;j<g.ids.length;j++){
      var el = elFor(g.ids[j]);
      if (el){ if (!el.hasAttribute("data-hlr")) el.setAttribute("data-hlo", el.style.cssText); el.setAttribute("data-hlr","1"); el.style.cssText = (el.getAttribute("data-hlo") || "") + HL; }
    }
  }
  function labelFor(g){ return isZh() ? g.zh : g.en; }
  function mkItem(g){
    var it = document.createElement("div"); it.setAttribute("data-grp", g.key); it.style.cssText = OFF;
    var num = document.createElement("span"); num.style.cssText = "flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:3px 8px;border-radius:999px;background:#E3F5EA;color:#008E43;border:1px solid #6BC592;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;font-weight:800;line-height:1.3;"; num.textContent = "×" + g.n;
    var lab = document.createElement("span"); lab.setAttribute("data-lab", g.key); lab.style.cssText = "font-size:13px;font-weight:600;color:#2B3A30;min-width:58px;text-align:left;"; lab.textContent = labelFor(g);
    it.appendChild(num); it.appendChild(lab);
    it.addEventListener("click", function(){ active = (active === g.key) ? null : g.key; applyHL(); });
    return it;
  }
  function ensureBox(){
    var c = document.querySelector(".panorama-center"); if (!c) return;
    var w = document.getElementById("cap-summary");
    if (!w){
      w = document.createElement("div"); w.id = "cap-summary"; w.style.cssText = "width:100%;max-width:152px;margin-top:4px;display:flex;flex-direction:column;gap:7px;";
      var eb = document.createElement("div"); eb.id = "cap-eb"; eb.style.cssText = "font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.14em;color:#737A82;font-weight:600;text-align:center;margin-bottom:2px;"; w.appendChild(eb);
      for (var i=0;i<GROUPS.length;i++){ w.appendChild(mkItem(GROUPS[i])); }
      c.appendChild(w);
    }
    var eb2 = document.getElementById("cap-eb"); var et = isZh() ? "能力构成 · PORTFOLIO" : "PORTFOLIO";
