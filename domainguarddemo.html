<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DomainGuard 仿冒域名监测与取证 · 带注释的交互式演示</title>
<style>
/* ============================================================
   DomainGuard — 仿冒域名监测与取证系统
   交互式演示（内容严格对齐实际功能；样式仿 GLP Soft Neo 设计令牌）
   全部数据为演示虚构，不含任何真实客户/域名信息

   与实现同步于 2026-08-16，本轮跟上的变更：
     · 顶部「取证存档」页签下线 → 证据包在确认仿冒时当场产出并弹出下载
     · 新增「自有资产」页（自监控）：资产巡检 / 子域名候选池 / 变更与异常 / 放行清单
     · 首页四张能力卡改为按当前配置与库内计数现算，「分级告警」换成自有资产监控
     · 首页场景卡改为真实条数、可点击跳队列筛选
     · 运营看板：漏斗 + 12 个流水线阶段，「频率 / 调度状态 / 上次运行」三列分开
     · 口径统一：首页、复核队列「全部」、看板场景分布共用 inScope() 一个定义
   ============================================================ */
:root{
  --canvas:#f3f3f1; --surface:#ffffff; --surface-2:#f8f8f6; --surface-sunken:#eef1ec; --softer:#f6f6f4;
  --border:#e2e6e2; --border-strong:#c9d2c9; --hairline:rgba(0,37,15,.08); --linefaint:#e7ebe6;
  --ink-900:#001b0b; --ink-800:#00250f; --ink-700:#20321f; --ink-600:#3f4a3d;
  --ink-500:#68706b; --ink-400:#8a928d; --ink-300:#b6bdb8;
  --primary:#00642f; --primary-700:#004d22; --primary-600:#0a7a3d; --green-ink:#00250f;
  --primary-soft:#e5f2e8; --primary-soft-2:#eef7f0; --primary-ink:#004d22;
  --risk-high:#b03030; --risk-high-soft:#f7e3e3; --risk-high-ink:#8a2424;
  --risk-med:#8a6a12; --risk-med-soft:#f7efdc; --risk-med-ink:#725804;
  --ok:#0a7a3d; --ok-soft:#e5f2e8; --warn:#d9a441; --warn-soft:#f7efdc; --warn-deep:#8a6a12;
  --orange:#c2621f; --orange-soft:#faf0e0; --orange-ink:#a5510f;
  --info:#3b82f6; --info-soft:#e4eefb; --info-ink:#235b9c;
  --neutral:#8a928d; --neutral-bg:#eef1ec;
  --cat-secret:#b03030; --cat-secret-soft:#f7e3e3; --cat-pii:#c2621f; --cat-pii-soft:#faf0e0;
  --cat-source:#3b82f6; --cat-source-soft:#e4eefb; --cat-config:#8a6a12; --cat-config-soft:#f7efdc;
  --cat-other:#68706b; --cat-other-soft:#eef1ec;
  --scene-t1:#8a928d; --scene-t1-bg:#eef1ec; --scene-t2:#d9a441; --scene-t2-bg:#f7efdc;
  --scene-t3:#d84d4d; --scene-t3-bg:#f7e3e3; --scene-t4:#0a7a3d; --scene-t4-bg:#e5f2e8;
  --font-sans:"Manrope","Noto Sans SC","Source Han Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --shadow-xs:0 1px 2px rgba(0,37,15,.06); --shadow-sm:0 1px 3px rgba(0,37,15,.08),0 0 0 1px rgba(0,37,15,.03);
  --shadow-soft:0 6px 18px rgba(0,37,15,.06); --shadow-card:0 10px 30px rgba(0,37,15,.08);
  --shadow-md:0 4px 12px rgba(0,37,15,.10),0 0 0 1px rgba(0,37,15,.04); --shadow-lg:0 8px 24px rgba(0,37,15,.16);
  --maxw:1240px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color:var(--ink-800);font-family:var(--font-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
body{background:linear-gradient(180deg,#f6f8f6 0%,#eef4ef 100%);}
button{font-family:inherit;cursor:pointer;}input,textarea{font-family:inherit;}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1;}
::selection{background:var(--primary-soft);}
@keyframes g-fade{from{opacity:0}to{opacity:1}}
@keyframes g-fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes g-spin{to{transform:rotate(360deg)}}
@keyframes anno-ping{0%{box-shadow:0 0 0 0 rgba(0,100,47,.5)}70%{box-shadow:0 0 0 8px rgba(0,100,47,0)}100%{box-shadow:0 0 0 0 rgba(0,100,47,0)}}
.spin{animation:g-spin .9s linear infinite;display:inline-block;}
.fade{animation:g-fade-up .35s ease;}
svg{flex:none;}

/* demo chrome */
.demo-bar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:18px;padding:10px 20px;background:#04170c;color:#dcefe3;border-bottom:1px solid #113a25;flex-wrap:wrap;}
.demo-bar .brandwrap{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:#fff;}
.demo-bar .brandwrap .badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:rgba(34,171,118,.2);color:#9ff0c8;font-size:10.5px;font-weight:700;letter-spacing:.06em;}
.stepper{display:flex;align-items:center;gap:6px;margin:0 auto;flex-wrap:wrap;}
.stepper button{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:#88b6a2;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;transition:all .14s;}
.stepper button .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.08);color:#9ff0c8;}
.stepper button.on{background:rgba(34,171,118,.16);color:#eafff4;border-color:rgba(34,171,118,.4);}
.stepper button.on .num{background:var(--primary-600);color:#fff;}
.stepper .arrow{color:#3c5f4f;font-size:13px;}
.demo-actions{display:flex;align-items:center;gap:10px;}
.demo-actions .toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid #2a5443;background:rgba(255,255,255,.04);color:#cdeeda;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;}
.demo-actions .toggle.on{background:var(--primary-600);border-color:var(--primary);color:#fff;}
.demo-actions .toggle .sw{width:30px;height:16px;border-radius:999px;background:#28473a;position:relative;transition:background .15s;}
.demo-actions .toggle.on .sw{background:#0c3b27;}
.demo-actions .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#9bbcae;transition:all .16s;}
.demo-actions .toggle.on .sw::after{left:16px;background:#fff;}
.demo-actions .ghost{border:1px solid #2a5443;background:transparent;color:#a9d2c0;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;}
.demo-actions .ghost:hover{background:rgba(255,255,255,.05);color:#fff;}

/* topnav */
.g-topnav{position:sticky;top:49px;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--linefaint);}
.g-topnav .inner{width:var(--maxw);max-width:94vw;margin:0 auto;display:flex;align-items:center;gap:10px;height:72px;}
.brandmark{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brandmark .glyph{width:44px;height:44px;border-radius:13px;flex:none;background:linear-gradient(155deg,var(--primary-600),var(--primary-700));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,77,34,.28);color:#fff;}
.brandmark .t1{font-weight:800;font-size:20px;color:var(--green-ink);line-height:1.05;letter-spacing:-.3px;}
.brandmark .t2{font-size:11.5px;color:var(--ink-500);font-weight:500;}
.g-topnav nav{display:flex;align-items:center;gap:3px;margin:0 auto;flex-wrap:wrap;}
.g-topnav nav button{border:none;background:transparent;color:var(--ink-800);font-weight:700;font-size:13.5px;padding:8px 13px;border-radius:999px;white-space:nowrap;}
.g-topnav nav button.on{background:linear-gradient(150deg,var(--primary-600),var(--primary-700));color:#fff;}
.tokpill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;background:var(--warn-soft);color:var(--warn-deep);font-size:12.5px;font-weight:700;white-space:nowrap;}
.tokpill .d{width:8px;height:8px;border-radius:50%;background:var(--warn-deep);}
.btn-primary{display:inline-flex;align-items:center;gap:7px;border:none;background:linear-gradient(150deg,var(--primary-600),var(--primary-700));color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 6px 14px rgba(0,77,34,.25);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-700);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;}
/* 置灰按钮必须看得出来是灰的。只加 disabled 属性而样式不变，用户会一直点，
   以为界面卡住了 —— 详情页那个「下载证据包 ZIP」在取证前正是这个状态。 */
.btn-ghost:disabled{opacity:.45;cursor:not-allowed;background:var(--softer);}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px;}

/* home / search */
.g-home{background:radial-gradient(circle at 10% 18%,rgba(0,100,47,.09),transparent 26%),linear-gradient(180deg,#f7faf7,#eef6f0);}
.wrap{width:var(--maxw);max-width:94vw;margin:0 auto;}
.g-home-main{display:grid;grid-template-columns:1fr 460px;gap:56px;align-items:start;padding:52px 0 76px;}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);font-weight:700;font-size:12.5px;margin-bottom:22px;}
h1.hero{font-size:46px;line-height:1.1;font-weight:900;letter-spacing:-1.3px;color:var(--green-ink);margin:0 0 20px;}
h1.hero .g{color:var(--primary-600);}
p.lede{font-size:16.5px;line-height:1.65;color:var(--ink-600);max-width:540px;margin:0 0 30px;}
.searchbox{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-card);}
.searchbox .mag{width:44px;height:44px;border-radius:12px;background:var(--softer);display:grid;place-items:center;color:var(--ink-400);flex:none;}
.searchbox input{flex:1;border:none;outline:none;font-size:15.5px;color:var(--ink-900);background:transparent;}
.searchbox .go{padding:13px 22px;border-radius:12px;background:var(--primary-soft);color:var(--primary-700);border:none;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;}
.g-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.g-tags span{font-size:12.5px;color:var(--ink-500);background:var(--surface);border:1px solid var(--linefaint);padding:5px 12px;border-radius:999px;cursor:pointer;}
.fieldlabel{font-size:12.5px;font-weight:700;color:var(--ink-400);}
.rangeseg{display:inline-flex;gap:4px;background:#eaeeea;padding:5px;border-radius:14px;flex-wrap:wrap;}
.rangeseg button{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;background:transparent;color:var(--ink-600);}
.rangeseg button.on{background:#fff;color:var(--primary-700);box-shadow:0 2px 8px rgba(0,37,15,.12);}
/* scene card */
.g-ev-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:0 18px 44px rgba(0,37,15,.10);}
.g-ev-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;}
.g-ev-head span{font-weight:800;font-size:18px;color:var(--green-ink);}
.g-ev-head b{font-size:10.5px;font-weight:700;color:#9fb3a6;letter-spacing:1px;}
.g-ev-tier{border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.g-ev-tier strong{display:block;font-weight:800;font-size:15px;margin-bottom:3px;}
.g-ev-tier p{margin:0;font-size:12.5px;color:var(--ink-700);line-height:1.5;}
.g-ev-tier .no{font-family:var(--font-mono);font-weight:800;font-size:26px;opacity:.4;}
.home-foot{padding:16px 0 34px;text-align:center;color:var(--ink-400);font-size:12px;}
.statrow3{display:flex;gap:22px;margin-top:20px;}
.statrow3>div{flex:1;text-align:center;background:var(--softer);border-radius:14px;padding:14px 8px;}
.statrow3 .n{font-size:24px;font-weight:800;font-family:var(--font-mono);color:var(--ink-900);}
.statrow3 .k{font-size:11.5px;color:var(--ink-500);font-weight:600;margin-top:2px;}
.iconrow{display:flex;gap:10px;justify-content:center;margin-top:8px;}
.iconrow button{width:44px;height:44px;border-radius:12px;border:1px solid var(--linefaint);background:#fff;display:grid;place-items:center;color:var(--ink-600);}
.recent-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--linefaint);cursor:pointer;font-size:12.5px;}

/* workbench / queue */
.pageband{padding:32px 0 70px;}
.wbhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:14px;}
.eyebrow{font-size:11.5px;font-weight:800;color:var(--primary-600);letter-spacing:1px;margin-bottom:6px;}
.h2{font-size:30px;font-weight:900;color:var(--green-ink);letter-spacing:-.5px;margin:0;}
.seg{display:inline-flex;background:#fff;border:1px solid var(--linefaint);border-radius:12px;padding:5px;gap:3px;flex-wrap:wrap;}
.seg button{padding:9px 15px;border-radius:9px;font-weight:700;font-size:13px;border:none;background:transparent;color:var(--ink-600);white-space:nowrap;}
.seg button.on{background:var(--primary-600);color:#fff;}
.searchmini{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linefaint);border-radius:999px;padding:10px 16px;flex:1;min-width:200px;max-width:420px;}
.searchmini input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px;}
.wbtable{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card);}
.wbrow{display:grid;grid-template-columns:34px 2fr 0.9fr 1.05fr 0.85fr 1fr 100px 78px;gap:14px;padding:14px 22px;align-items:center;}
.wbhd{background:var(--softer);border-bottom:1px solid var(--border);font-size:11.5px;font-weight:800;color:var(--ink-500);letter-spacing:.3px;}
.wbtr{border-bottom:1px solid var(--hairline);cursor:pointer;transition:background .12s;text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%;}
.wbtr:hover{background:var(--softer);}
.scorebadge{font-size:18px;font-weight:800;font-family:var(--font-mono);}
.simsub{font-size:11px;color:var(--ink-400);margin-top:3px;font-variant-numeric:tabular-nums;}
.forcedtag{font-size:10.5px;color:var(--ink-400);margin-top:3px;cursor:help;}
.scenepill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;display:inline-block;}
.riskpill{font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;display:inline-block;}
.statuspill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surface-sunken);color:var(--ink-600);display:inline-block;}
.reopenbanner{font-size:11px;color:var(--warn-deep);margin-top:4px;display:flex;align-items:center;gap:4px;}
.clustertag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);}
.checkcell{display:flex;align-items:center;justify-content:center;}
.dg-checkbox{width:16px;height:16px;}

/* detail */
.backlink{display:inline-flex;align-items:center;gap:7px;color:var(--ink-500);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:16px;}
.dheadcard{background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px 28px;box-shadow:var(--shadow-card);margin-bottom:18px;}
.dheadtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.dscore{text-align:right;}
.dscore .n{font-size:38px;font-weight:800;font-family:var(--font-mono);line-height:1;color:var(--ink-900);}
.dscore .k{font-size:11px;color:var(--ink-400);font-weight:700;}
.dscore .sim{font-size:11.5px;color:var(--ink-500);margin-top:4px;}
.dgrid{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;}
.tier{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:16px;}
.tier .th{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-left:5px solid;flex-wrap:wrap;gap:6px;}
.tier .th .tt{font-weight:800;font-size:15.5px;}
.tier .th .rt{font-size:11.5px;font-weight:700;}
.tier .tb{padding:18px 20px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow-card);margin-bottom:16px;}
.factor{margin-bottom:12px;}
.factor .fl{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;}
.factor .fbar{height:8px;background:var(--neutral-bg);border-radius:6px;overflow:hidden;}
.factor .fbar>div{height:100%;border-radius:6px;}
.clusterbox{margin-top:16px;padding:14px 16px;border:1px solid var(--border);border-left:3px solid var(--primary-600);border-radius:10px;background:var(--softer);}
.clusterhead{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:8px;}
.clustermembers{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
/* 加白/仍在检测的后果说明 —— 必须紧挨着按钮，只靠 toast 一闪而过没人记得住 */
.wlhint{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--softer);font-size:12.5px;line-height:1.7;color:var(--ink-500);}
.wlhinton{background:var(--primary-soft);color:var(--primary-ink);}
.clusterchip{font-size:12px;font-family:var(--font-mono);padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;}
.clusterchip.self{border-color:var(--primary-600);color:var(--primary-700);cursor:default;}
.shotgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.shotcard{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--softer);}
.shotph{height:180px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef1ec,#e2e8e3);color:var(--ink-400);font-size:12px;flex-direction:column;gap:6px;}
.shotmeta{padding:10px 14px;font-size:11.5px;color:var(--ink-500);line-height:1.7;}
.shotmeta b{color:var(--ink-800);}
.minibox{background:var(--softer);border-radius:10px;padding:11px 13px;}
.minibox .k{font-size:11.5px;color:var(--ink-400);font-weight:600;}.minibox .v{font-weight:700;font-size:13px;margin-top:2px;word-break:break-all;}
.fpbox{padding:12px 14px;background:var(--primary-soft);border-radius:10px;font-size:12.5px;color:var(--primary-ink);line-height:1.6;}
.tlitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--hairline);}
.tlitem:last-child{border-bottom:none;}
.tldot{width:9px;height:9px;border-radius:50%;background:var(--primary-600);margin-top:5px;flex:none;}

/* rules page */
.ruletable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card);}
.ruletable th{background:var(--softer);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);text-align:left;padding:12px 14px;}
.ruletable td{border-bottom:1px solid var(--hairline);padding:12px 14px;font-size:12.5px;color:var(--ink-700);vertical-align:top;}
.ruletable tr:last-child td{border-bottom:none;}
.tierbadge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0;background:var(--surface-sunken);color:var(--ink-600);}

/* board */
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.statcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-soft);}
.statcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.statcard .lbl{font-size:13px;color:var(--ink-500);font-weight:700;}
.statcard .dot{width:10px;height:10px;border-radius:50%;}
.statcard .val{font-size:28px;font-weight:800;color:var(--ink-900);font-family:var(--font-mono);line-height:1;}
.statcard .delta{font-size:12px;font-weight:700;margin-top:6px;}
.pipetable{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card);}
/* 六列一律 minmax(0,Nfr)，不能直接写 Nfr。
   fr 的自动最小值是 min-content：行里只要出现一个不可断行的长串

// 已加白的域名不参与聚类 —— 它已经退出检测，继续把它算进组里会让
// "这个组有 N 个域名待处理"这句话不成立。与 domainguard/cluster.py 同一口径。
function clusterOf(id){
  const c=CLUSTERS.find(x=>x.members.includes(id));
  if(!c)return null;
  const active=c.members.filter(m=>findDomain(m).status!=="whitelisted");
  if(active.length<2)return null;
  return {...c,members:active};
}

  "a-scope":{n:4,title:"复核队列的六个视图",src:"api.py · _SCOPE_SQL",body:"待复核 / 已判误报 / 已确认仿冒 / 已加白 / 监控池 / 全部。<b>「全部」不含监控池与已加白</b> —— 加白的语义就是退出检测，让它出现在日常视图里等于加白没生效；这个口径与首页场景卡、看板场景分布是同一份定义。<br><br><b>人工判定过的域名不会被自动流程冲掉</b>：reanalyze / capture_run / ingest 三处统一守着 <code>MANUAL_VERDICTS</code> 常量，只更新分数不改状态；只有分数比判定当时升高，才退回待复核并标出理由。"},

  "a-cluster":{n:7,title:"同源聚类",src:"domainguard/cluster.py",body:"只认<b>同 IP 且页面 DOM 指纹一致</b>，或<b>同一张证书 SAN</b>（签发时 CA 验证过控制权）。单独同 IP 不算数——那会把整个共享主机/CDN 误判成一伙。停放页/空壳（T1）不参与聚类，避免同一套错误页模板被误判成同源。"},
  "a-verdict":{n:8,title:"三个判定按钮",src:"api.py · POST /domains/{id}/review",body:"<b>确认仿冒并取证</b>：自动触发增强级证据包归档（PC+移动截图、HTML、DNS/RDAP/TLS 快照、SHA-256 清单）。<b>判为误报</b>：移出待复核，但<b>域名仍在检测中</b>——分数比判定当时升高会自动退回复核。<b>持续观察</b>：留在监控节奏里，不算处置完成。要让误报永久免检，需在详情页再点一次「批准加入白名单」。"},

  "a-evidence":{n:13,title:"取证时间线",src:"domainguard/evidence.py",body:"每次归档记录文件数、体积、NTP 校时偏差、留存期限。<b>顶部原本的「取证存档」页签已下线</b> —— 证据包在点「确认仿冒并取证」时当场产出，导出弹窗随即弹出，ZIP 在那一步就能拿到；历史版本留在这条时间线里。单开一个归档页等于让人为了下载再找一次路。<br><br><b>当前没有 WORM 存储</b>，防篡改仅靠审计哈希链自证；界面与取证说明单里如实标注这一限制，不夸大证据强度。"},

  "a-thresholds":{n:15,title:"阈值与分级规则",src:"config/assets.yaml · scoring.thresholds",body:"入库看<b>相似度</b>（发现标准），分级看<b>综合得分</b>（风险标准）——一个赌博站点综合得分可能只有 50，但域名高度相似，必须进台账研判。"},
  "a-board":{n:16,title:"检测节奏与覆盖范围",src:"config/schedule.json · /api/v1/pipeline",body:"三件事被<b>刻意拆成三列</b>：<b>频率</b>是配置说它该多久跑一次；<b>调度状态</b>是去问任务计划程序它还会不会再跑；<b>上次运行</b>取自审计日志，是它真的跑过的记录。三者对不上，正是最需要被看见的那种故障 —— 「仅登录时」这一整片黄色角标就是这么露出来的：任务状态全是 Ready，但注销后一个都不会跑。<br><br>不会拿产物文件的修改时间伪装成「刚跑过」；确实只有产物时间可依据时，会在旁边注明来源。"},

  "a-capability":{n:21,title:"四张能力卡的正文是算出来的",src:"api.py · _capabilities()",body:"标题与正文都由后端读<b>当前配置 + 库里真实计数</b>现算，缺什么就写缺什么，角标（有缺口 / 未生效）也是算出来的，不是写死的文案。<br><br>第四格原来是「分级告警」，正文写着『高风险实时推送』 —— 而告警早已按需求方要求关停、一条都没发过。<b>首页在替一个关停的功能作保</b>，是最容易骗到人的那种界面。现在换成当前真正在跑的自有资产监控。"},
  "a-selfwatch":{n:22,title:"自有资产监控 · 反方向的监测",src:"domainguard/selfwatch.py",body:"前面几页问「别人有没有在仿冒我」，这一页问「我自己的域名和网站有没有出事」。所以这里<b>既没有风险分也没有 T1~T4</b> —— 那套语义对自己的域名不成立，只有两件事：现在是什么状态、跟上次比变了什么。<br><br>刻意把「查过了，没问题」和「探针根本没查到」分成两种显示：混为一谈的话，页面会一片绿而其实什么都没在查，那是监控系统最坏的一类故障。"},
  "a-broken":{n:23,title:"探测失败必须单列",src:"AssetsPage · brokenChecks",body:"「N 项检查没能取到数据」—— 这些<b>不等于「没问题」，是「没查到」</b>。不显式列出来的话，一个挂掉的探针会安静地伪装成『这个资产正常』。当前这三条里有两条是采集出口 IP 被企业 WAF 拦截，需要加白（《待提供清单》第 19 项）。"},
  "a-candidate":{n:24,title:"发现子域名 ≠ 纳入监控",src:"discover.py · /assets/candidates",body:"四路来源合并：证书日志 / 字典枚举（330 词，先探随机名排除通配 DNS）/ 证书 SAN / 官网自链接。<b>发现不自动纳管</b> —— 里面会有测试环境、已下线的旧站、第三方托管的营销页，哪些需要保护是业务判断。<br><br>但没纳管的子域名等于没在监控，而攻击者恰恰偏爱那些没人记得的老子域名。<b>悬挂 CNAME</b> 是其中最危险的一类：指向的云资源已释放，任何人都能把它注册回来接管这个子域名，还能自行申请到有效证书。"},
  "a-allowlist":{n:25,title:"放行清单的两条铁律",src:"selfwatch.py · allow_redirect_to / allow_script_hosts",body:"① <b>必须按「来源 + 目标」成对放行</b>。只按目标放行 —— 比如『凡是跳到 microsoftonline.com 都算正常』 —— 等于给自己开一个洞：任何一个自有域名被劫持后跳到那里都会被静音。<br><br>② <b>放行不等于不记录</b>。命中放行清单的仍然产出 <code>info</code> 级发现（REDIRECT_ALLOWED / NEW_SCRIPT_HOST_ALLOWED），变化照样看得见，只是不再当作告警。<br><br>两条都用反向断言测过：把来源换成别的域名，必须重新报警。"},
  "a-whitelist":{n:17,title:"批准加入白名单 · FR-403",src:"domainguard/whitelist.py · POST /domains/{id}/whitelist",body:"只在<b>已判误报</b>的域名上出现，且不提供驳回——不批就是不批，域名照常检测。加白必须是独立于「判为误报」的第二次显式操作：自动加白会被攻击者利用来给自己洗白，只要把仿冒站做得像正常业务、骗一次误报判定，域名就永久免检了。加白后彻底退出检测（不采集、不富化、不评分告警），写入独立的 <code>whitelist_approved.yaml</code>（不改写手写的 assets.yaml），随时可在详情页撤销恢复检测。不提供批量/整组加白。"},

/* ============================ 工具 ============================ */
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function pin(k,corner){return `<span class="anno-pin${corner?' corner':''}" data-anno="${k}">${ANNOS[k].n}</span>`;}
function fmtScene(s){const m=SCENE[s]||SCENE.T1;return `<span class="scenepill" style="background:${m.bg};color:${m.c}">${s} · ${m.label}</span>`;}
function fmtRisk(r){const m=riskStyle(r);return `<span class="riskpill" style="background:${m.bg};color:${m.c}">${m.label}</span>`;}
function findDomain(id){return DOMAINS.find(d=>d.id===id);}
/* 「在检测口径内」的**唯一定义** —— 对应后端 api.py 的 _SCOPE_SQL["all"]。
   首页场景卡、复核队列的「全部」页签、运营看板的场景分布三处共用它。
   之前三处各写各的 WHERE，数字互相对不上；口径这种东西只能有一份定义。
   监控池 = 还没有实质网站，加白 = 已经退出检测，两类都不算在内。 */
function inScope(d){return d.status!=="monitoring"&&d.status!=="whitelisted";}
function pushAudit(action,cat,target,detail){AUDIT.unshift({action,cat,target,detail,actor:"分析师 · 当前用户",at:new Date().toISOString().slice(0,19).replace("T"," ")});}

      <div class="searchbox"><div class="mag">${icon("search",19,1.7)}</div>

      <div class="g-tags" id="chips">${["glp.com","glp.com.cn","普洛斯","Homoglyph","Punycode"].map(t=>`<span data-q="${t}">${t}</span>`).join("")}</div>

      <div style="margin-top:22px">

        <div class="rangeseg" id="rangeseg">${[["24h","最近 24 小时"],["3d","最近 3 天"],["7d","最近 7 天"],["30d","最近 30 天"],["custom","自定义"]].map(([v,l])=>`<button data-r="${v}" class="${STATE.range===v?'on':''}">${l}</button>`).join("")}</div>

/* 判定逻辑：确认仿冒 / 误报 / 持续观察 —— 与真实系统同样的副作用 */
function applyVerdict(id,verdict,note){
  const d=findDomain(id);if(!d)return;
  const map={confirmed:"confirmed",false_positive:"false_positive",watch:"watching"};
  const newStatus=map[verdict]||verdict;
  d.status=newStatus;
  if(newStatus==="confirmed"||newStatus==="false_positive"){
    d.verdictAt=new Date().toISOString().slice(0,16).replace("T"," ");d.verdictScore=d.score;d.verdictBy="analyst";
  }
  pushAudit("review","研判",d.domain,`判定「${verdict==='confirmed'?'确认仿冒':verdict==='false_positive'?'误报':'持续观察'}」· 判定时得分 ${d.score}`+(note?` · ${note}`:""));
  if(newStatus==="confirmed"){
    d.timeline=d.timeline||[];
    d.timeline.unshift(["v"+(d.timeline.length+1),"增强级证据包归档",`人工确认仿冒后固定证据；共固定 ${10+Math.floor(Math.random()*8)} 个文件、${(1+Math.random()*18).toFixed(1)} MB；已向 ntp.aliyun.com 校时，偏差 ${2+Math.floor(Math.random()*8)} ms；保留至 2029-08-06`]);
    EVIDENCE.unshift({domain:d.domain,version:1,trigger:"人工确认仿冒后固定证据",files:12,size:"9.1 MB",ntp:true,ntpSrc:"ntp.aliyun.com",ntpOffset:5,retention:"2029-08-06",hash:Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2),at:new Date().toISOString().slice(0,16).replace("T"," ")});
  }
  // 判为误报**不会**自动加白，也不产出待审建议。误报只是"这次不是仿冒"，
  // 域名仍在检测中，分数升高会自动退回复核；要永久免检必须在详情页
  // 再点一次「批准加入白名单」——这是独立的第二次显式操作。
}

/* FR-403 加入白名单 —— 只对已判误报的域名开放，加白后彻底退出检测。
   不提供批量加白/整组加白：批量免检是最危险的操作，不给这个入口。 */
function approveWhitelist(id,note){
  const d=findDomain(id);if(!d||d.status!=="false_positive")return;
  d.status="whitelisted";
  d.verdictAt=new Date().toISOString().slice(0,16).replace("T"," ");d.verdictScore=d.score;
  // 命中白名单是 analyze() 里最早的一个分支，直接短路返回 —— 根本不会跑
  // FR-301~FR-308 那些规则，所以真实系统里加白后"命中规则明细"是空的，
  // 不是"旧命中还在、只是分数改成了 0"。这里把 hits 也清空，保持一致。
  d.score=0;d.risk="low";d.scene="T1";d.note="命中官方资产白名单，不产生告警";
  d.hits=[];d.decisionReason="命中官方资产白名单，评分归零，不再产生告警。";
  pushAudit("whitelist_approve","白名单",d.domain,`加入白名单 · 写入 whitelist_approved.yaml · 已退出检测`+(note?` · ${note}`:""));
}
function revokeWhitelist(id){
  const d=findDomain(id);if(!d||d.status!=="whitelisted")return;
  d.status="false_positive";
  pushAudit("whitelist_revoke","白名单",d.domain,"撤销加白 · 已从 whitelist_approved.yaml 移除 · 恢复检测");
}

        <div style="font-size:11.5px;color:var(--ink-400);margin-top:8px">同组域名出自同一主体，通常处置结论相同。但加白是逐个域名确认的 —— 不提供整组批量加白，批量免检是最危险的操作。</div>
      </div>`:''}

      <div class="wbhead" style="margin:18px 0 0;align-items:center">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn-primary btn-sm" id="btnConfirm" ${d.status==='confirmed'?'disabled':''}>确认仿冒并取证${pin("a-verdict")}</button>
          <button class="btn-ghost btn-sm" id="btnFp" ${d.status==='false_positive'?'disabled':''}>判为误报</button>
          <button class="btn-ghost btn-sm" id="btnWatch" ${d.status==='watching'?'disabled':''}>持续观察</button>
          <button class="btn-ghost btn-sm" id="btnExport" ${(!d.timeline||d.timeline.length===0)?'disabled title="该域名尚未产生证据包，先点「确认仿冒并取证」"':''}>下载证据包 ZIP</button>
          ${d.status==='false_positive'?`<button class="btn-ghost btn-sm" id="btnWl" title="加入白名单后该域名退出检测：不再采集、不再评分告警">批准加入白名单${pin("a-whitelist")}</button>`:''}
          ${d.status==='whitelisted'?`<button class="btn-ghost btn-sm" id="btnRevokeWl">撤销加白，恢复检测${pin("a-whitelist")}</button>`:''}
        </div>
      </div>
      ${d.status==='false_positive'?`<div class="wlhint">当前仍在检测中：分数升高（出现新证据）会自动退回待复核。点「批准加入白名单」后该域名<b>退出检测</b> —— 不再采集、不再富化、不再评分告警，也不会因分数变化被退回。</div>`:''}
      ${d.status==='whitelisted'?`<div class="wlhint wlhinton">已加入白名单，<b>已退出检测</b>。写入 <code class="mono">config/whitelist_approved.yaml</code>，不再消耗采集与情报补齐额度。要恢复检测，点上方「撤销加白」。</div>`:''}
    </div>

    <div class="dgrid">
      <div>
        <div class="panel">
          <div style="font-weight:800;font-size:15.5px;color:var(--green-ink);margin-bottom:4px">命中规则明细${pin("a-rulehits")}</div>
          <div style="font-size:12px;color:var(--ink-400);margin-bottom:14px">规则版本 v5 · 明细权重之和 = 综合得分 ${d.score}</div>
          ${d.hits.map(([code,name,pts,max,detail])=>{const r=Math.abs(pts)/Math.max(Math.abs(max)||1,1);const c=pts<0?'var(--ok)':r>=.85?'var(--risk-high)':r>=.5?'var(--orange)':'var(--warn)';return `
          <div class="factor"><div class="fl"><span style="color:var(--ink-700)"><b>${code}</b> ${name}</span><span class="mono" style="font-weight:800;color:${c}">${pts>=0?'+':''}${pts}</span></div>
            <div class="fbar"><div style="width:${Math.min(100,Math.round(r*100))}%;background:${c}"></div></div>
            <div style="font-size:11.5px;color:var(--ink-500);margin-top:4px">${detail}</div></div>`;}).join("")}
          <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--linefaint);font-size:12.5px;color:var(--ink-600);line-height:1.6"><b>研判结论：</b>${d.decisionReason}</div>
        </div>

        <div class="panel"><div style="font-weight:800;font-size:15.5px;color:var(--green-ink);margin-bottom:10px">误报控制${pin("a-fp")}</div>
          <div class="fpbox">${d.fpNote}</div></div>

        <div class="panel"><div style="font-weight:800;font-size:15.5px;color:var(--green-ink);margin-bottom:4px">采集快照${pin("a-capture")}</div>
          <div style="font-size:12px;color:var(--ink-400);margin-bottom:14px">仅 GET、禁用下载、不提交表单、单域名限流；每张截图落 SHA-256</div>
          ${d.captures.length===0?`<div style="padding:20px;text-align:center;color:var(--ink-400);background:var(--softer);border-radius:10px">尚未执行页面采集（该域名未进入采集队列 / Playwright 未运行）</div>`:`
          <div class="shotgrid">${d.captures.map(c=>`<div class="shotcard"><div class="shotph">${icon("camera",34,1.5)}<span>${c.ua.toUpperCase()} 整页截图（演示占位）</span></div>
            <div class="shotmeta"><div>HTTP <b>${c.status}</b> · ${c.size} · ${c.time}</div>${c.flags.length?`<div style="color:var(--risk-high-ink);margin-top:4px">⚠ ${c.flags.join(' · ')}</div>`:''}<div class="mono" style="margin-top:4px;font-size:10.5px;color:var(--ink-400)">SHA-256 ${fakeHash(c.ua+d.domain)} ✓</div></div></div>`).join("")}</div>`}
          <div style="margin-top:14px;font-size:12.5px;color:var(--ink-500)"><b>最终跳转链：</b>${d.finalUrl?`200 → <span class="mono">${d.finalUrl}</span>`:'（无解析或连接失败）'}</div>
        </div>

        <div class="panel"><div style="font-weight:800;font-size:15.5px;color:var(--green-ink);margin-bottom:12px">域名情报${pin("a-intel")}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            ${[["注册商",d.registrar],["注册时间",d.registeredAt||"—（RDAP 查不到，需商业 API）"],["解析 IP",d.ip||"—"],["建站探测结论",d.webVerdict||"—"]].map(([k,v])=>`<div class="minibox"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
          </div></div>

        <div class="panel"><div style="font-weight:800;font-size:15.5px;color:var(--green-ink);margin-bottom:4px">取证时间线${pin("a-evidence")}</div>
          ${(!d.timeline||d.timeline.length===0)?`<div style="padding:16px;text-align:center;color:var(--ink-400);background:var(--softer);border-radius:10px">该域名尚未产生证据包。判定为「确认仿冒」后将自动触发增强级取证。</div>`:
            d.timeline.map(([v,title,detail])=>`<div class="tlitem"><div class="tldot"></div><div><div style="font-weight:700;font-size:13.5px">增强级证据包归档 ${v}</div><div style="font-size:12px;color:var(--ink-500);margin-top:3px;line-height:1.6">${detail}</div></div></div>`).join("")}
        </div>
      </div>

      <div>
        <div class="panel" style="background:var(--warn-soft);border-color:#ecdca6"><div style="font-weight:800;font-size:13.5px;color:var(--warn-deep);margin-bottom:6px">合规边界</div>
          <div style="font-size:12px;color:#8a6608;line-height:1.7">研判结论为线索，非最终司法/合规结论；采集不遵循 robots.txt 但仅 GET；账号溯源仅公开信息聚合，标注「推测」，不做个人指认；证据无 WORM 存储，防篡改仅靠哈希链自证。</div></div>
      </div>
    </div>
  </div>`;
  // 「取证存档」页签下线后，这里就是拿到 ZIP 的**主路径**：确认即取证，
  // 取证即弹下载。判定完先重渲染再开弹窗 —— 弹窗读的是刚产出的证据包清单，
  // 顺序反了会拿到判定前的旧数据，首次确认时干脆是空的，明明刚取完证，
  // 界面却说"该域名尚未产生证据包"。
  $("#btnConfirm").onclick=()=>{applyVerdict(d.id,"confirmed");toast("已确认仿冒 · 证据包已生成，可直接下载");renderDetail();openExport(d.id);};
  $("#btnFp").onclick=()=>{applyVerdict(d.id,"false_positive");toast("已判为误报 · 移出待复核，仍在检测中，分数升高会自动退回");renderDetail();};
  $("#btnWatch").onclick=()=>{applyVerdict(d.id,"watch");toast("已转入持续观察 · 每日复查已启用");renderDetail();};
  $("#btnExport").onclick=()=>{if(!d.timeline||d.timeline.length===0)return;openExport(d.id);};
  const wlBtn=$("#btnWl");if(wlBtn)wlBtn.onclick=()=>{approveWhitelist(d.id);toast("已加入白名单 · 该域名退出检测，不再采集与评分");renderDetail();};
  const wlRevoke=$("#btnRevokeWl");if(wlRevoke)wlRevoke.onclick=()=>{revokeWhitelist(d.id);toast("已撤销加白 · 该域名恢复检测，下一轮重新评分");renderDetail();};
  $$("[data-open]").forEach(b=>b.onclick=()=>{STATE.detailId=b.dataset.open;renderDetail();});
  bindView();
}
function fakeHash(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;return h.toString(16).padStart(8,'0')+"…"+((h*2654435761)>>>0).toString(16).padStart(8,'0');}

/* ============================ 证据包下载弹窗 ============================ */
/* 原本的「取证存档」独立页签已下线。证据包在确认仿冒的那一刻当场产出，
   这个弹窗随即弹出 —— 拿 ZIP 就在这一步，不用再去别的页面找一次。
   历史版本仍然完整保留在详情页的「取证时间线」里。 */
function openExport(id){
  const d=findDomain(id);if(!d)return;
  const e=EVIDENCE.find(x=>x.domain===d.domain)||EVIDENCE[0];
  const versions=(d.timeline||[]).length||1;
  $("#overlay").innerHTML=`<div class="scrim" id="exScrim"><div class="intro" style="max-width:560px">
    <div class="ih"><h2 style="font-size:18px">下载证据包</h2><p>${d.domain} · 共 ${versions} 个版本，将打包为一个 ZIP。一次性下载链接，15 分钟内有效。</p></div>
    <div class="modalbody">
      <div class="wlfacts">
        <div><div class="k">文件数</div><div class="v">${e.files} 个</div></div>
        <div><div class="k">体积</div><div class="v">${e.size}</div></div>
        <div><div class="k">NTP 校时</div><div class="v">偏差 ${e.ntpOffset}ms</div></div>
        <div><div class="k">留存至</div><div class="v">${e.retention}</div></div>
      </div>
      <div style="font-size:12px;color:var(--ink-500);line-height:1.7;margin-bottom:12px">
        包含 PC + 移动双端整页截图、原始 HTML、DNS / RDAP / TLS 快照、跳转链记录，
        以及一份 <code class="mono">MANIFEST</code>（每个文件的 SHA-256）。
        <span class="mono" style="font-size:11px;color:var(--ink-400);display:block;margin-top:6px">MANIFEST SHA-256 · ${e.hash}</span>
      </div>
      <div class="formfield"><label>导出用途 · 选填，会写入审计日志</label>
        <input class="forminput" id="exPurpose" placeholder="例如：提交法务 / 域名投诉材料 / 工单 #4821"/></div>
      <div style="padding:11px 14px;background:var(--warn-soft);border-radius:9px;font-size:12px;color:var(--warn-deep);line-height:1.6">
        技术存证，非司法存证：存放在普通文件系统，防篡改仅靠审计哈希链，未接入具备 Object Lock 的对象存储。
      </div>
    </div>
    <div class="if"><button class="btn-ghost btn-sm" id="exCancel" style="margin-right:10px">取消</button>
      <button class="btn-primary" id="exGo">${icon("download",15,2,"#fff")} 确认下载</button></div>
  </div></div>`;
  $("#exScrim").onclick=e2=>{if(e2.target.id==="exScrim")$("#overlay").innerHTML="";};
  $("#exCancel").onclick=()=>$("#overlay").innerHTML="";
  $("#exGo").onclick=()=>{
    const p=$("#exPurpose").value.trim();
    pushAudit("evidence_export","取证",d.domain,`导出证据包 ZIP · 用途「${p||'（未填写）'}」`);
    $("#overlay").innerHTML="";
    toast(`证据包已生成 · evidence_${d.domain.replace(/\./g,'_')}.zip`);
  };
}

/* ============================ 自有资产（自监控） ============================ */
/* 与其余页面回答的是相反的问题：
     监测台 / 复核队列   别人有没有在仿冒我
     本页               我自己的域名和网站有没有出事
   所以这里既没有风险分也没有 T1~T4 —— 那套语义对自己的域名不成立。 */
const HEALTH_LABEL={ok:["正常","dotok"],warn:["有待确认","dotwarn"],alarm:["异常","dotalarm"],error:["探测失败","doterr"],unknown:["尚未检查","dotunknown"]};
const SEV_LABEL={critical:["严重","sevcritical"],high:["高","sevhigh"],medium:["中","sevmedium"],info:["提示","sevinfo"]};
const CHK_CLS={ok:"chkok",bad:"chkbad",deg:"chkdeg"};
let ASSET_SCOPE="open", CAND_SCOPE_V="new";

function renderAssets(){
  const openCh=ASSET_CHANGES.filter(c=>c.status==="open");
  const sevCount={};openCh.forEach(c=>sevCount[c.sev]=(sevCount[c.sev]||0)+1);
  const list=ASSET_CHANGES.filter(c=>c.status===ASSET_SCOPE);
  const cands=CANDIDATES.filter(c=>c.status===CAND_SCOPE_V);
  const nNew=CANDIDATES.filter(c=>c.status==="new").length;
  const dangling=CANDIDATES.filter(c=>c.state==="dangling"&&c.status==="new");

  $("#app").innerHTML=`${topnav("assets")}<div class="wrap pageband fade">
    <div class="wbhead"><div>
      <div class="eyebrow">SELF WATCH · 自有资产</div>
      <h2 class="h2">自有资产监控${pin("a-selfwatch")}</h2>
      <div style="font-size:13.5px;color:var(--ink-500);margin-top:8px;max-width:860px;line-height:1.6">
        只盯两件事：<b>网站内容有没有被篡改</b>（结构被改、挂暗链、植入第三方脚本、出现不良信息）、
        <b>网站有没有被劫持</b>（解析被改到别处、NS/MX 被改、子域名接管、跳转到站外）。
        证书与域名注册信息<b>不在监控范围内</b> —— 代码里已实现，按业务侧要求关掉了。
      </div></div>
      <div style="text-align:right">
        <div style="display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap">
          ${Object.keys(sevCount).length===0?`<span class="acked">${icon("check",15,2.4)} 没有待确认的变更</span>`:
            ["critical","high","medium","info"].filter(s=>sevCount[s]).map(s=>`<span class="sev ${SEV_LABEL[s][1]}">${SEV_LABEL[s][0]} ${sevCount[s]}</span>`).join("")}
        </div>
        <div style="font-size:11.5px;color:var(--ink-400);margin-top:8px">最近检查 2026-08-16 17:12</div>
      </div>
    </div>

    ${(()=>{const bc=brokenChecks();return bc.length===0?'':`
    <div class="broken anno-anchor" style="position:relative">${pin("a-broken","corner")}
      <div class="brokentitle">${icon("alert",15,2)}${bc.length} 项检查没能取到数据 —— 这些不等于「没问题」，是「没查到」</div>
      ${bc.map(c=>`<div class="brokenrow"><span class="brokendom">${c.domain}</span><span class="chkpill chkbad">${c.label}</span><span>${c.err}</span></div>`).join("")}
    </div>`;})()}

    <div class="wbtable" style="margin-bottom:8px">
      <div class="assetgrid pipehd" style="background:var(--softer);border-bottom:1px solid var(--border);align-items:center">
        <div>资产域名</div><div>状态</div><div>各项检查</div><div>待确认</div><div>最近检查</div></div>
      ${ASSETS.map(a=>{const h=HEALTH_LABEL[a.health];return `<div class="assetgrid">
        <div><div style="font-weight:800;font-size:13.5px;color:var(--ink-900)">${a.domain}</div>
          ${a.sites.map(s=>`<div style="font-size:11px;color:var(--ink-400);margin-top:2px">${s}</div>`).join("")}</div>
        <div style="font-size:12.5px;display:flex;align-items:center"><span class="dot ${h[1]}"></span>${h[0]}</div>
        <div>${a.checks.map(g=>`<div class="chkrow"><span class="chksub">${g.sub}</span><span>${g.pills.map(([l,st,note])=>`<span class="chkpill ${CHK_CLS[st]}" title="${g.sub} · ${st==='bad'?'没查到 —— '+note:st==='deg'?l+' 正常（降级）：'+note:l+' 正常'}">${st==='deg'?'≈ ':''}${l}</span> `).join("")}</span></div>`).join("")}</div>
        <div>${a.open>0?`<span class="tag tagwarn">${a.open}</span>`:'<span class="muted">—</span>'}</div>
        <div style="font-size:12px;color:var(--ink-500)">${a.last}</div>
      </div>`;}).join("")}
      <div style="display:flex;justify-content:space-between;padding:12px 20px;font-size:11.5px;color:var(--ink-400);background:var(--softer)">
        <span>共 ${ASSETS.length} 个资产 · 27 个检查目标</span><span>域名层每小时一轮，内容层每 6 小时一轮</span></div>

      ≈ 表示该结论是<b>降级取到</b>的（绕道测的）。全绿而其中一半是绕过去测的，等于把「测过了」和「绕过去测的」混为一谈。
    </div>

    <div class="wbhead" style="margin-bottom:6px"><h3 class="h2" style="font-size:20px">发现的子域名，尚未纳入监控${pin("a-candidate")} ${nNew?`<span class="tag tagwarn">${nNew}</span>`:''}</h3>
      <div class="seg" id="candSeg">${[["new","待处理"],["adopted","已纳管"],["ignored","已忽略"]].map(([v,l])=>`<button data-cs="${v}" class="${CAND_SCOPE_V===v?'on':''}">${l}</button>`).join("")}</div></div>

    ${dangling.length&&CAND_SCOPE_V==="new"?`<div class="orphan">

      <div class="brokenrow"><span>CNAME 指向的目标解析不出地址。若该云资源已被释放，任何人都能重新注册它，从而在你的子域名上托管任意内容，还能自行申请到有效证书。处置方式：确认服务是否已下线，是就把这条 CNAME 从 DNS 里删掉。</span></div>

    <div class="wbtable" style="margin-bottom:30px">

        <div><div style="font-weight:800;font-size:13px;color:var(--ink-900)" class="mono">${c.portal?'<span title="域名冒充企业入口" style="color:var(--risk-high)">★ </span>':''}${c.host}</div>
          ${c.cname?`<div style="font-size:11px;margin-top:3px;color:${c.state==='dangling'?'var(--risk-high-ink)':'var(--ink-400)'}">CNAME → ${c.cname}${c.state==='dangling'?' · 目标解析不出地址，可能被他人接管':''}</div>`:''}</div>
        <div>${c.src.map(s=>`<span class="chkpill" style="background:var(--surface-sunken);color:var(--ink-600)">${s}</span> `).join("")}</div>
        <div>${c.state==='dangling'?'<span class="sev sevcritical">悬挂 CNAME</span>':c.state==='site'||c.state==='portal'?'<span class="sev sevmedium">有网站</span>':c.state==='resolve'?'<span class="muted">有解析</span>':'<span class="muted">无解析</span>'}</div>
        <div style="font-size:12px;color:var(--ink-600)">${c.title}</div>
        <div>${c.status==="new"?`<button class="btn-primary btn-sm" data-adopt="${c.host}">纳入监控</button>
          <button class="btn-ghost btn-sm" data-ignore="${c.host}" style="margin-left:6px">不需要</button>`:
          `<span class="muted">${c.status==='adopted'?'已纳管':'已忽略'}${c.decidedAt?' · '+c.decidedAt:''}</span>`}</div>

      list.map(c=>`<div class="change">
      <div class="changehead"><span class="sev ${SEV_LABEL[c.sev][1]}">${SEV_LABEL[c.sev][0]}</span>
        <span class="changedom">${c.target||c.domain}</span><span class="changeparent">${c.domain}</span>
        <span class="chkpill" style="background:var(--surface-sunken);color:var(--ink-600)">${c.kind}</span>
        <span class="changetime">${c.at}</span></div>

          `<span class="acked">${icon("check",13,2.4)} 已由 ${c.ackBy} 于 ${c.ackAt} 确认</span>`}</div>
    </div>`).join("")}

    <div class="panel" style="margin-top:22px">
      <div style="font-weight:800;font-size:14px;color:var(--green-ink);margin-bottom:10px">放行清单 · 已知且合理的跳转与脚本来源</div>
      <table class="ruletable" style="box-shadow:none"><thead><tr><th>类型</th><th>放行目标</th><th>仅对以下来源生效</th><th>理由</th></tr></thead>
      <tbody>${ALLOWLIST.map(a=>`<tr><td style="font-weight:700;white-space:nowrap">${a.kind}</td><td class="mono">${a.to}</td><td>${a.from}</td><td>${a.why}</td></tr>`).join("")}</tbody></table>
      <div style="margin-top:12px;font-size:12.5px;color:var(--ink-600);line-height:1.7">
        <b>必须按「来源 + 目标」成对放行。</b>只按目标放行 —— 比如『凡是跳到 microsoftonline.com 都算正常』 ——
        等于给自己开一个洞：任何一个自有域名被劫持后跳到那里都会被静音。<br>
        <b>放行不等于不记录。</b>命中放行清单的仍然产出 <code class="mono">info</code> 级发现
        （<code class="mono">REDIRECT_ALLOWED</code> / <code class="mono">NEW_SCRIPT_HOST_ALLOWED</code>），变化照样看得见，只是不再当作告警。
      </div>
    </div>

    <div style="margin-top:20px;padding:16px 18px;background:var(--warn-soft);border-radius:14px;font-size:12.5px;color:var(--warn-deep);line-height:1.7">
      <b>能力边界</b>：本页是<b>外部黑盒视角</b>的监测 —— 能看到「首页被改了」「解析被换了」，
      看不到「服务器上被放了 webshell 但页面没变」，不能替代主机侧的 EDR / WAF。
      发现延迟等于检查间隔，不是实时。不良信息识别为关键词规则（与 FR-306 同一套），覆盖不全且会误报，结论需人工确认。
    </div>
  </div>`;
  $("#chSeg").onclick=e=>{const b=e.target.closest("[data-ch]");if(b){ASSET_SCOPE=b.dataset.ch;renderAssets();}};
  $("#candSeg").onclick=e=>{const b=e.target.closest("[data-cs]");if(b){CAND_SCOPE_V=b.dataset.cs;renderAssets();}};
  $$("[data-ack]").forEach(b=>b.onclick=()=>{
    const c=ASSET_CHANGES.find(x=>String(x.id)===b.dataset.ack);if(!c)return;
    c.status="acknowledged";c.ackBy="分析师 · 当前用户";c.ackAt=new Date().toISOString().slice(0,16).replace("T"," ");
    pushAudit("asset_change_ack","自监控",c.target||c.domain,`确认「${c.title}」为正常变更 · ${c.code}`);
    toast(`已确认 ${c.target||c.domain} 的「${c.title}」为正常变更`);renderAssets();});
  const decide=(host,st)=>{const c=CANDIDATES.find(x=>x.host===host);if(!c)return;
    c.status=st;c.decidedAt=new Date().toISOString().slice(0,16).replace("T"," ");
    pushAudit(st==="adopted"?"asset_adopt":"asset_ignore","自监控",host,
      st==="adopted"?"纳入监控 · 写入 watch_urls_adopted.yaml · 下一轮巡检开始检查":"标记为不需要监控");
    toast(st==="adopted"?`${host} 已纳入监控，下一轮巡检开始检查`:`已忽略 ${host}`);renderAssets();};
  $$("[data-adopt]").forEach(b=>b.onclick=()=>decide(b.dataset.adopt,"adopted"));
  $$("[data-ignore]").forEach(b=>b.onclick=()=>decide(b.dataset.ignore,"ignored"));
  bindView();
}

/* ============================ 运营看板 ============================ */
function renderBoard(){
  // 误报率的分子要把 whitelisted 也算进去 —— 加白的前提就是先判过误报，
  // 加白只是"这条误报永久免检"，不是"这条不算误报了"。只数 false_positive
  // 会让误报率随着加白增多而悄悄变好看，方向反了。
  const reviewed=DOMAINS.filter(d=>["confirmed","false_positive","whitelisted"].includes(d.status)).length;
  const fp=DOMAINS.filter(d=>d.status==="false_positive"||d.status==="whitelisted").length;
  const stats=[["待复核域名",DOMAINS.filter(d=>d.status==="reviewing"||d.status==="watching").length,"var(--warn-deep)"],
    ["高风险待处置",DOMAINS.filter(d=>inScope(d)&&d.risk==="high").length,"var(--risk-high-ink)"],
    ["已确认仿冒",DOMAINS.filter(d=>d.status==="confirmed").length,"var(--ok)"],
    ["误报率",reviewed?Math.round(fp/reviewed*100)+"%":"—","var(--ink-500)"]];
  // 场景分布与首页、复核队列共用 inScope() —— 三处曾各写各的 WHERE，
  // 于是同一个 T1 在三个页面上是三个数字。
  const scenes=["T1","T2","T3","T4"].map(s=>[s,DOMAINS.filter(d=>d.scene===s&&inScope(d)).length]);
  const maxScene=Math.max(...scenes.map(s=>s[1]),1);
  const nInterOnly=PIPELINE.filter(p=>p.sched==="interactive").length;
  const nNever=PIPELINE.filter(p=>!p.lastRun).length;
  $("#app").innerHTML=`${topnav("board")}<div class="wrap pageband fade">
    ${pageHead("运营看板","OPERATIONS BOARD","检测节奏与覆盖范围、处置情况、场景分布 —— 全部数据来自审计日志与台账真实状态，不是估算。")}

    <!-- 漏斗放在最前：先看清每一层收敛到多少，再看每一层跑得怎么样 -->
    <div class="funnel">${FUNNEL.map((f,i)=>`<div class="fc">
      <div class="fk">${f.label}</div><div class="fv">${f.value.toLocaleString()}</div>
      <div class="fn">${i>0?`<span class="fp">${(f.value/FUNNEL[0].value*100).toFixed(2)}%</span>`:''}${f.note}</div></div>`).join("")}</div>

    <div class="statstrip">${stats.map(([l,v,c])=>`<div class="statcard"><div class="top"><div class="lbl">${l}</div><div class="dot" style="background:${c}"></div></div><div class="val">${v}</div><div class="delta" style="color:var(--ink-400)">${l==='误报率'&&!reviewed?'尚无人工复核记录，误报率无意义':' '}</div></div>`).join("")}</div>

    <h3 class="h2" style="font-size:20px;margin:28px 0 6px">检测节奏与覆盖范围${pin("a-board")}</h3>
    <p style="font-size:12.5px;color:var(--ink-500);margin-bottom:14px">
      「频率」是配置说它该多久跑一次，「调度状态」是任务计划程序里它还会不会再跑，
      「上次运行」来自审计日志、是它真的跑过的记录。三件事分开显示 —— 对不上正是最需要被看见的故障。
      ${nNever>0?`<b style="color:var(--warn-deep)"> 当前 ${nNever} 个阶段从未运行。</b>`:''}
    </p>

    ${nInterOnly>0?`<div class="schednote schedwarn anno-anchor" style="position:relative">${pin("a-sched","corner")}
      ${icon("alert",16,2)}<span>${SCHED_PROBLEM}</span></div>`:
      `<div class="schednote schedok">${icon("check",16,2)}<span>${PIPELINE.length} 个阶段的定时任务已全部注册，均可在后台运行。</span></div>`}

    <div class="pipetable">
      <div class="piperow pipehd"><div>阶段</div><div>频率</div><div>调度状态</div><div>范围</div><div>每轮处理</div><div>上次运行</div></div>
      ${PIPELINE.map(p=>{const sc=SCOPE_STYLE[p.scope];const sd=SCHED_STYLE[p.sched];return `<div class="piperow">
        <div><div style="font-weight:700;font-size:13.5px">${p.label}</div>
          <div class="pipemeta">${p.req} · ${p.target}</div></div>
        <div style="font-size:12.5px;color:var(--ink-600);line-height:22px">${p.freq}</div>
        <div><span class="scopebadge" style="background:${sd.bg};color:${sd.fg}" title="${sd.tip}">${sd.label}</span>
          <div class="pipemeta">${p.next?`下次 ${p.next}`:p.task}</div></div>
        <div><span class="scopebadge" style="background:${sc.bg};color:${sc.fg}">${sc.label}</span>
          <div class="pipemeta">${p.scopeDetail}</div></div>
        <div class="mono" style="font-size:12.5px;color:var(--ink-700);line-height:22px">${p.vol===null?'—':p.vol.toLocaleString()}</div>
        <div><div style="font-size:12.5px;color:var(--ink-700);line-height:22px">${p.lastRun}</div>
          <div class="pipemeta">${p.lastAt}</div>
          ${p.summary?`<div class="pipemeta">${p.summary}</div>`:''}</div></div>`;}).join("")}
      <div style="padding:12px 20px;font-size:11.5px;color:var(--ink-400);background:var(--softer);line-height:1.6">
        「上次运行」取自审计日志，是任务真的跑过的记录；「下次运行」直接问任务计划程序，是它还会不会再跑。两者都对得上，这个阶段才算真的在运行。
      </div>
    </div>

    <h3 class="h2" style="font-size:20px;margin:28px 0 14px">场景分布</h3>
    <div class="panel">${scenes.map(([s,n])=>`<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div style="width:100px;font-size:12.5px;font-weight:700;color:${SCENE[s].c}">${s} ${SCENE[s].label}</div><div style="flex:1;height:10px;background:var(--surface-sunken);border-radius:6px;overflow:hidden"><div style="width:${n/maxScene*100}%;height:100%;background:${SCENE[s].c};border-radius:6px"></div></div><div class="mono" style="width:30px;text-align:right;font-weight:800">${n}</div></div>`).join("")}
      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--linefaint);font-size:11.5px;color:var(--ink-400);line-height:1.6">
        口径与首页、复核队列的「全部」页签完全一致：监控池（无实质网站）与已加白（已退出检测）都不计入。
      </div></div>
  </div>`;bindView();
}

  $("#ikSubmit").onclick=()=>{
    const dom=$("#ikDomain").value.trim();if(!dom){toast("请填写域名");return;}
    pushAudit("intake","检索",dom,`人工提报 · 举报理由：${$("#ikReason").value||'（未填写）'} · 举报人：${$("#ikReporter").value||'（未填写）'}`);
    toast("已提交，正在发起即时研判…");runInstantScan(dom);
  };
  bindView();
}

function pageHead(title,eyebrow,desc,pk){return `<div class="wbhead"><div><div class="eyebrow">${eyebrow}</div><h2 class="h2">${title}${pk?pin(pk):''}</h2><div style="font-size:13.5px;color:var(--ink-500);margin-top:8px;max-width:860px;line-height:1.6">${desc}</div></div></div>`;}

/* ============================ toast / 注释 ============================ */
let toastT=null;function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:120;background:#04170c;color:#e7f6ee;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);max-width:90vw;display:flex;align-items:center;gap:9px";document.body.appendChild(t);}t.innerHTML=icon("check",16,2.4,"#9ff0c8")+msg;t.style.opacity="1";clearTimeout(toastT);toastT=setTimeout(()=>{t.style.transition="opacity .4s";t.style.opacity="0";},2800);}
let curAnno=null;
function bindAnno(){document.body.addEventListener("click",e=>{const p=e.target.closest(".anno-pin");if(p){e.stopPropagation();showAnno(p.dataset.anno,p);return;}if(!e.target.closest(".anno-pop"))hideAnno();});window.addEventListener("scroll",hideAnno,true);}
function showAnno(k,el){const a=ANNOS[k];if(!a)return;hideAnno();const p=document.createElement("div");p.className="anno-pop";
  p.innerHTML=`<div class="ah"><span class="n">${a.n}</span><span class="ti">${a.title}</span><button class="closep">${icon("x",16)}</button></div><div class="ab">${a.body}<div class="src">${icon("layers",12)}${a.src}</div></div>`;
  document.body.appendChild(p);const r=el.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;let left=r.left+r.width/2-pw/2,top=r.bottom+10;
  if(left<8)left=8;if(left+pw>innerWidth-8)left=innerWidth-pw-8;if(top+ph>innerHeight-8)top=r.top-ph-10;if(top<8)top=8;p.style.left=left+"px";p.style.top=top+"px";p.querySelector(".closep").onclick=hideAnno;curAnno=p;}
function hideAnno(){if(curAnno){curAnno.remove();curAnno=null;}}

/* ============================ 路由 ============================ */
function go(v){STATE.view=v;render();scrollTo(0,0);}
function render(){hideAnno();$("#overlay").innerHTML="";
  if(STATE.view==="home")renderHome();
  else if(STATE.view==="queue")renderQueue();
  else if(STATE.view==="detail")renderDetail();
  else if(STATE.view==="assets")renderAssets();
  else if(STATE.view==="rules")renderRules();
  else if(STATE.view==="board")renderBoard();
  else if(STATE.view==="audit")renderAudit();
  else if(STATE.view==="intake")renderIntake();
  syncStepper();}
function bindView(){$$("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));}
function syncStepper(){const map={home:"home",queue:"queue",detail:"detail"};$$("#stepper button").forEach(b=>b.classList.toggle("on",map[STATE.view]===b.dataset.step));}

$("#stepper").onclick=e=>{const b=e.target.closest("[data-step]");if(b)go(b.dataset.step);};
$("#annoToggle").onclick=()=>{const on=document.body.classList.toggle("anno-on");$("#annoToggle").classList.toggle("on",on);if(!on)hideAnno();};
$("#restartBtn").onclick=()=>{STATE.view="home";STATE.scope="pending";STATE.risk="all";STATE.scene="all";STATE.qq="";STATE.selected.clear();go("home");};
$("#introBtn").onclick=showIntro;
function showIntro(){$("#overlay").innerHTML=`<div class="scrim" id="iScrim"><div class="intro"><div class="ih"><h2>DomainGuard 交互式演示</h2><p>仿冒域名监测与取证系统 —— 从变体字典发现，到相似度研判、风险分级、人工复核、证据固定、白名单回流的完整闭环。本演示为完全虚构的示例数据。</p></div>
  <div class="ib">
    <div class="step"><span class="n">1</span><div><div class="tt">监测台</div><div class="dd">检索台账，或对新域名发起真实即时研判（DNS+建站探测+Playwright采集+RDAP/TLS/CT）。</div></div></div>
    <div class="step"><span class="n">2</span><div><div class="tt">复核队列</div><div class="dd">六个视图（待复核/已判误报/已确认仿冒/已加白/监控池/全部），风险/场景筛选，同源聚类标注，批量处置。首页场景卡点一下就带着筛选跳进来。</div></div></div>
    <div class="step"><span class="n">3</span><div><div class="tt">域名详情</div><div class="dd">可解释评分（命中规则明细）+ 误报控制 + 采集快照 + 域名情报 + 取证时间线 + 三个判定按钮。<b>点「确认仿冒并取证」当场产出证据包并弹出下载</b> —— 原「取证存档」页签已下线。</div></div></div>
    <div class="step"><span class="n">🛡</span><div><div class="tt">自有资产（新）</div><div class="dd"><b>反方向</b>的监测：前面几页看别人有没有仿冒我们，这一页看我们自己的域名与官网有没有被篡改、被劫持。含子域名发现候选池与放行清单。</div></div></div>
    <div class="step"><span class="n">▦</span><div><div class="tt">顶部六个板块</div><div class="dd">监测台 / 复核队列 / 自有资产 / 风险规则 / 运营看板 / 审计日志，均可点击。</div></div></div>
    <div class="step"><span class="n">★</span><div><div class="tt">注释模式</div><div class="dd">界面上闪烁的绿色数字 ❶❷❸ 可点击，查看每个区域对应的真实实现文件与合规边界。</div></div></div>
  </div><div class="if"><button class="btn-primary" id="iStart">开始体验 ${icon("arrowR",16,2,"#fff")}</button></div></div></div>`;
  $("#iScrim").onclick=e=>{if(e.target.id==="iScrim")$("#overlay").innerHTML="";};$("#iStart").onclick=()=>$("#overlay").innerHTML="";}

bindAnno();render();showIntro();
</script>
</body>
</html>
